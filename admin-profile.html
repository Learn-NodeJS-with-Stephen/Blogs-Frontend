<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/Loopple/loopple-public-assets@main/riva-dashboard-tailwind/riva-dashboard.css"
    />
    <style>
      body {
        min-height: 100vh;
      }
      main {
        margin-left: 16rem;
      }
    </style>
  </head>
  <body class="bg-white text-black font-sans min-h-screen">
    <!-- Sidebar (same as your other admin pages) -->
    <aside
      class="w-64 bg-zinc-900 text-white min-h-screen p-6 fixed inset-y-0 left-0"
    >
      <div class="mb-10">
        <h1 class="text-2xl font-bold tracking-wide mb-2">Admin Panel</h1>
        <span class="text-zinc-400 text-sm">Thought Nest</span>
      </div>
      <!-- Admin Profile Section -->
      <div class="flex flex-col items-center mb-8">
        <img
          id="admin-avatar"
          src="https://ui-avatars.com/api/?name=Admin&background=random"
          alt="Admin Avatar"
          class="w-16 h-16 rounded-full mb-2"
        />
        <h2 id="admin-username" class="font-semibold text-lg text-teal-400">
          Admin User
        </h2>
        <p class="text-xs text-gray-300">Administrator</p>
      </div>
      <nav class="flex-1">
        <ul class="space-y-2 text-lg font-medium">
          <li>
            <a
              href="admin-dashboard.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-bar-chart"></i></span> Dashboard
            </a>
          </li>
          <li>
            <a
              href="admin-users.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-user"></i></span> Users
            </a>
          </li>
          <li>
            <a
              href="admin-posts.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-file"></i></span> Posts
            </a>
          </li>
          <li>
            <a
              href="admin-categories.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-category"></i></span> Categories
            </a>
          </li>
          <li>
            <a
              href="admin-reports.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-flag"></i></span> Report/Flags
            </a>
          </li>
          <li>
            <a
              href="admin-profile.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition bg-zinc-800"
            >
              <span><i class="bx bx-user-circle"></i></span> Profile
            </a>
          </li>
          <li>
            <a
              href="#"
              onclick="logout()"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-log-out"></i></span> Logout
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="p-8">
      <h2 class="text-2xl font-bold mb-6">Admin Profile</h2>
      <div
        class="relative flex-[1_auto] flex flex-col break-words min-w-0 bg-clip-border rounded-[.95rem] bg-white m-5"
      >
        <div
          class="relative flex flex-col min-w-0 break-words border border-dashed bg-clip-border rounded-2xl border-stone-200 bg-light/30"
        >
          <div
            class="px-9 pt-5 flex justify-between items-center flex-wrap min-h-[70px] pb-0 bg-transparent"
          >
            <h3
              class="flex flex-col items-start justify-center m-2 ml-0 font-medium text-xl/tight text-dark"
            >
              <span class="mr-3 font-semibold text-dark">Profile Details</span>
            </h3>
          </div>
          <div class="flex-auto block py-8 pt-6 px-9">
            <div class="max-w-xl mx-auto">
              <form id="admin-profile-form" class="space-y-6">
                <div class="flex flex-col items-center mb-6">
                  <img
                    id="profile-avatar"
                    src="https://ui-avatars.com/api/?name=Admin&background=random"
                    alt="Admin Avatar"
                    class="w-24 h-24 rounded-full mb-2"
                  />
                  <input
                    type="file"
                    id="avatar-upload"
                    accept="image/*"
                    class="mt-2"
                  />
                </div>
                <div>
                  <label class="block font-semibold mb-1" for="profile-username"
                    >Username</label
                  >
                  <input
                    type="text"
                    id="profile-username"
                    class="input border border-gray-300 rounded px-4 py-2 w-full"
                    required
                  />
                </div>
                <div>
                  <label class="block font-semibold mb-1" for="profile-email"
                    >Email</label
                  >
                  <input
                    type="email"
                    id="profile-email"
                    class="input border border-gray-300 rounded px-4 py-2 w-full"
                    required
                  />
                </div>
                <div>
                  <label class="block font-semibold mb-1" for="current-password"
                    >Current Password</label
                  >
                  <input
                    type="password"
                    id="current-password"
                    class="input border border-gray-300 rounded px-4 py-2 w-full"
                    placeholder="Enter current password to change password"
                    autocomplete="current-password"
                  />
                </div>
                <div>
                  <label class="block font-semibold mb-1" for="new-password"
                    >New Password</label
                  >
                  <input
                    type="password"
                    id="new-password"
                    class="input border border-gray-300 rounded px-4 py-2 w-full"
                    placeholder="Leave blank to keep current password"
                    autocomplete="new-password"
                  />
                </div>
                <button
                  type="submit"
                  class="btn-primary px-4 py-2 rounded font-bold text-white bg-blue-600 hover:bg-blue-700 w-full"
                >
                  Update Profile
                </button>
                <div
                  id="profile-message"
                  class="mb-4 text-center font-semibold"
                ></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script>
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      }

      // Load admin profile info
      document.addEventListener("DOMContentLoaded", function () {
        const user = JSON.parse(localStorage.getItem("user") || "{}");
        if (user && user.username) {
          document.getElementById("admin-username").textContent = user.username;
          document.getElementById("admin-avatar").src =
            user.avatar ||
            `https://ui-avatars.com/api/?name=${encodeURIComponent(
              user.username
            )}&background=random`;
          document.getElementById("profile-username").value = user.username;
          document.getElementById("profile-email").value = user.email || "";
          document.getElementById("profile-avatar").src =
            user.avatar ||
            `https://ui-avatars.com/api/?name=${encodeURIComponent(
              user.username
            )}&background=random`;
        }
      });

      // Handle profile update
      document
        .getElementById("admin-profile-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const username = document
            .getElementById("profile-username")
            .value.trim();
          const email = document.getElementById("profile-email").value.trim();
          const currentPassword =
            document.getElementById("current-password").value;
          const newPassword = document.getElementById("new-password").value;
          const msg = document.getElementById("profile-message");
          msg.textContent = "";

          if (!username || !email) {
            msg.textContent = "Username and email are required.";
            msg.className = "mb-4 text-center font-semibold text-red-600";
            return;
          }

          const formData = {
            username,
            email,
          };

          // Only send password fields if user is trying to change password
          if (currentPassword || newPassword) {
            if (!currentPassword || !newPassword) {
              msg.textContent =
                "Both current and new password are required to change password.";
              msg.className = "mb-4 text-center font-semibold text-red-600";
              return;
            }
            formData.currentPassword = currentPassword;
            formData.newPassword = newPassword;
          }

          // Handle avatar upload (optional)
          const avatarInput = document.getElementById("avatar-upload");
          if (avatarInput.files && avatarInput.files[0]) {
            // For demo: just show preview, not upload to backend
            const reader = new FileReader();
            reader.onload = function (e) {
              document.getElementById("profile-avatar").src = e.target.result;
            };
            reader.readAsDataURL(avatarInput.files[0]);
            // To actually upload, send the file to your backend here
          }

          // Send update to backend
          const res = await fetch("http://localhost:3600/admin/profile", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + localStorage.getItem("token"),
            },
            body: JSON.stringify(formData),
          });
          const data = await res.json();
          if (data.success) {
            msg.textContent = "Profile updated!";
            msg.className = "mb-4 text-center font-semibold text-green-600";
            // Optionally update localStorage user info
            localStorage.setItem(
              "user",
              JSON.stringify({
                ...JSON.parse(localStorage.getItem("user") || "{}"),
                username,
                email,
              })
            );
            // Clear password fields
            document.getElementById("current-password").value = "";
            document.getElementById("new-password").value = "";
          } else {
            msg.textContent =
              data.message || data.error || "Failed to update profile.";
            msg.className = "mb-4 text-center font-semibold text-red-600";
          }
        });
    </script>
  </body>
</html>
