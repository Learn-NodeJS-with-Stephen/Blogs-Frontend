<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
      }
      main {
        margin-left: 16rem;
      }
    </style>
  </head>
  <body class="bg-white text-black font-sans min-h-screen">
    <!-- Sidebar (same as other admin pages) -->
    <aside
      class="w-64 bg-zinc-900 text-white min-h-screen p-6 fixed inset-y-0 left-0"
    >
      <div class="mb-10">
        <h1 class="text-2xl font-bold tracking-wide mb-2">Admin Panel</h1>
        <span class="text-zinc-400 text-sm">Thought Nest</span>
      </div>
      <nav class="flex-1">
        <ul class="space-y-2 text-lg font-medium">
          <li class="mb-4">
            <a
              href="index.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-home"></i></span> Home
            </a>
          </li>
          <li>
            <a
              href="admin-dashboard.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-bar-chart"></i></span> Dashboard
            </a>
          </li>
          <li>
            <a
              href="admin-users.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-user"></i></span> Users
            </a>
          </li>
          <li>
            <a
              href="admin-posts.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-file"></i></span> Posts
            </a>
          </li>
          <li>
            <a
              href="admin-categories.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-category"></i></span> Categories
            </a>
          </li>
          <li>
            <a
              href="admin-reports.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-flag"></i></span> Report/Flags
            </a>
          </li>
          <li>
            <a
              href="admin-profile.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-user-circle"></i></span> Profile
            </a>
          </li>
          <li>
            <a
              href="#"
              onclick="logout()"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-log-out"></i></span> Logout
            </a>
          </li>
        </ul>
      </nav>
    </aside>
    <main class="p-8 flex justify-center items-center min-h-screen">
      <div class="w-full max-w-3xl">
        <!-- Increased from max-w-xl to max-w-3xl -->
        <h2 class="text-2xl font-bold mb-6 text-center">Edit Post</h2>
        <form
          id="edit-post-form"
          class="bg-gray-100 rounded-lg shadow p-8 space-y-6"
        >
          <!-- Increased padding and spacing -->
          <div>
            <label class="block mb-1 font-semibold">Title</label>
            <input
              type="text"
              id="post-title"
              name="title"
              class="input w-full border border-gray-300 rounded px-4 py-3 text-lg"
              required
            />
          </div>
          <div>
            <label class="block mb-1 font-semibold">Content</label>
            <textarea
              id="post-content"
              name="content"
              rows="16"
              class="input w-full border border-gray-300 rounded px-4 py-3 text-base"
              required
            ></textarea>
          </div>
          <div>
            <label class="block mb-1 font-semibold">Category</label>
            <select
              id="post-category"
              name="blog_category_id"
              class="input w-full border border-gray-300 rounded px-4 py-2 text-base"
              required
            >
              <option value="">Select category</option>
              <option value="1">General</option>
              <option value="2">Personal_blogs</option>
              <option value="3">Lifestyle_blogs</option>
              <option value="4">Food_blogs</option>
              <option value="5">Tech_blogs</option>
              <option value="6">Business_blogs</option>
              <option value="7">Travel_blogs</option>
              <option value="8">Health_blogs_and_fitness_blogs</option>
              <option value="9">Techie News</option>
            </select>
          </div>
          <button
            type="submit"
            class="btn-primary w-full py-3 rounded font-bold text-white bg-blue-600 hover:bg-blue-700 text-lg"
          >
            Update Post
          </button>
        </form>
        <div id="message" class="mt-4 text-center font-semibold"></div>
      </div>
    </main>
    <script>
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      }

      // Get post ID from URL
      function getPostId() {
        const params = new URLSearchParams(window.location.search);
        return params.get("id");
      }

      // Fetch post data and fill the form
      async function loadPost() {
        const postId = getPostId();
        if (!postId) {
          document.getElementById("message").textContent =
            "No post ID provided.";
          return;
        }
        const res = await fetch(`https://blogs-api-q51w.onrender.com/blogs/${postId}`, {
          headers: {
            Authorization: "Bearer " + localStorage.getItem("token"),
          },
        });
        if (!res.ok) {
          document.getElementById("message").textContent =
            "Failed to load post.";
          return;
        }
        const data = await res.json();
        if (data.success && data.data) {
          document.getElementById("post-title").value = data.data.title;
          document.getElementById("post-content").value = data.data.content;
          // Set the category select value
          document.getElementById("post-category").value =
            data.data.blog_category_id;
        } else {
          document.getElementById("message").textContent = "Post not found.";
        }
      }

      // Handle form submission
      document.getElementById("edit-post-form").onsubmit = async function (e) {
        e.preventDefault();
        const postId = getPostId();
        const title = document.getElementById("post-title").value.trim();
        const content = document.getElementById("post-content").value.trim();
        const blog_category_id = document.getElementById("post-category").value;

        const res = await fetch(`https://blogs-api-q51w.onrender.com/blogs/${postId}`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + localStorage.getItem("token"),
          },
          body: JSON.stringify({ title, content, blog_category_id }),
        });
        const data = await res.json();
        const msg = document.getElementById("message");
        if (data.success) {
          msg.textContent = "Post updated successfully!";
          msg.className = "mt-4 text-center font-semibold text-green-600";
          setTimeout(() => {
            window.location.href = "admin-posts.html";
          }, 1200);
        } else {
          msg.textContent =
            data.message || data.error || "Failed to update post.";
          msg.className = "mt-4 text-center font-semibold text-red-600";
        }
      };

      // Load post on page load
      window.onload = function () {
        loadPost();
      };
    </script>
  </body>
</html>
