<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-purple-100 via-purple-200 to-purple-300 flex items-center justify-center min-h-screen"
  >
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
      <h2 class="text-3xl font-bold text-purple-800 mb-6 text-center">
        Admin Login
      </h2>
      <form id="admin-login-form" class="space-y-4">
        <input
          type="email"
          id="admin-email"
          name="email"
          placeholder="Email"
          required
          class="w-full p-3 border border-purple-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-400"
        />
        <input
          type="password"
          id="admin-password"
          name="password"
          placeholder="Password"
          required
          class="w-full p-3 border border-purple-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-400"
        />
        <button
          type="submit"
          class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white rounded font-semibold transition-all"
        >
          Login
        </button>
        <div
          id="admin-login-message"
          class="text-center text-red-600 text-sm mt-2"
        ></div>
      </form>
    </div>
    <script>
      document
        .getElementById("admin-login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("admin-email").value;
          const password = document.getElementById("admin-password").value;
          const msg = document.getElementById("admin-login-message");
          msg.textContent = "";

          try {
            const res = await fetch("http://localhost:3600/admin/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            const data = await res.json();
            if (data.success && data.token && data.user) {
              if (data.user.role && data.user.role !== "admin") {
                msg.textContent = "Only admin can login here.";
                return;
              }
              localStorage.setItem("token", data.token);
              localStorage.setItem("user", JSON.stringify(data.user));
              window.location.href = "admin-dashboard.html";
            } else {
              msg.textContent = data.message || "Invalid admin credentials.";
            }
          } catch (err) {
            msg.textContent = "Login failed. Please try again.";
          }
        });
    </script>
  </body>
</html>
