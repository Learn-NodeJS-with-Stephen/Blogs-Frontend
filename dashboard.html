<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded shadow">
      <h2 class="text-2xl font-bold text-green-600 mb-4">
        Account Created / Logged In Successfully!
      </h2>
      <p class="mb-6">
        Welcome, <span id="username" class="font-semibold"></span>!
      </p>
      <h3 class="text-xl font-semibold mb-2">Your Blog Posts</h3>
      <div id="user-posts" class="space-y-4"></div>
    </div>
    <script>
      // Get user info from localStorage
      const user = JSON.parse(localStorage.getItem("user"));
      const token = localStorage.getItem("token");
      document.getElementById("username").textContent =
        user?.username || user?.email || "User";

      // Fetch user's blog posts
      fetch(
        "http://localhost:3600/blogs/user/" + (user?.id || user?.username),
        {
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        }
      )
        .then((res) => res.json())
        .then((data) => {
          const postsDiv = document.getElementById("user-posts");
          if (data.success && data.data && data.data.length > 0) {
            data.data.forEach((post) => {
              const div = document.createElement("div");
              div.className = "bg-gray-50 p-4 rounded shadow";
              div.innerHTML = `
              <h4 class="font-bold">${post.title}</h4>
              <p>${post.content.substring(0, 120)}...</p>
              <span class="text-xs text-gray-500">${new Date(
                post.created_at
              ).toLocaleString()}</span>
            `;
              postsDiv.appendChild(div);
            });
          } else {
            postsDiv.innerHTML = "<p>No blog posts found for your account.</p>";
          }
        });
    </script>
  </body>
</html>
