<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-900 font-sans">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 py-5 sticky top-0 z-50">
      <div class="container mx-auto px-4 flex items-center justify-between">
        <h1 class="text-3xl font-bold tracking-wide text-gray-900">
          THOUGHT NEST
        </h1>
        <div class="flex-1 flex justify-center">
          <button
            id="theme-toggle"
            class="px-3 py-1 rounded bg-gray-200 text-gray-800 hover:bg-gray-300 transition"
          >
            Dark Mode
          </button>
        </div>
        <nav>
          <nav>
        <ul class="flex gap-6 text-lg font-medium">
          <li><a href="index.html" class="hover:underline">HOME</a></li>
          <li><a href="blog.html" class="hover:underline">BLOG</a></li>
          <!-- <li>
            <a href="admin-dashboard.html" class="hover:underline font-bold"
              >ADMIN</a
            >
          </li> -->
          <li>
            <a href="admin-login.html" class="hover:underline"
              >ADMIN</a
            >
          </li>
          <!-- <li><a href="about.html" class="hover:underline">About</a></li>
            <li><a href="contact.html" class="hover:underline">Contact</a></li> -->
        </ul>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <section class="max-w-4xl mx-auto mt-10 px-4">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">
          Welcome, <span id="dashboard-username"></span>!
        </h2>
        <button
          id="show-create-form"
          class="px-4 py-2 rounded font-bold text-white bg-purple-600 hover:bg-purple-700"
        >
          Create New Post
        </button>
      </div>

      <!-- Create Post Form -->
      <div id="create-post-form" class="mb-8 hidden">
        <div class="bg-white rounded-lg shadow-md p-6">
          <h3 class="text-xl font-bold text-gray-800 mb-4">New Post</h3>
          <form id="post-form" class="space-y-4">
            <input
              type="text"
              name="title"
              placeholder="Title"
              required
              class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
            />
            <textarea
              name="content"
              placeholder="Content"
              required
              class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
              rows="5"
            ></textarea>
            <input
              type="number"
              name="blog_category_id"
              placeholder="Category ID"
              required
              class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
            />
            <button
              type="submit"
              class="px-4 py-2 rounded font-bold text-white bg-purple-600 hover:bg-purple-700"
            >
              Post
            </button>
          </form>
        </div>
      </div>

      <!-- User Posts -->
      <h3 class="text-2xl font-bold text-gray-800 mb-6">Your Posts</h3>
      <div id="user-posts" class="space-y-8"></div>

      <!-- Pagination -->
      <div class="flex mt-8">
        <button
          id="prev-page"
          class="px-3 py-2 mx-1 font-medium text-gray-500 bg-white rounded-md"
          disabled
        >
          Previous
        </button>
        <span id="page-numbers" class="flex"></span>
        <button
          id="next-page"
          class="px-3 py-2 mx-1 font-medium text-gray-700 bg-white rounded-md"
        >
          Next
        </button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 text-gray-600 py-8 mt-10">
      <div class="container mx-auto px-4 text-center space-y-4">
        <div class="flex justify-center gap-6">
          <a href="#" class="hover:text-gray-900">Instagram</a>
          <a href="#" class="hover:text-gray-900">Twitter</a>
          <a href="#" class="hover:text-gray-900">Facebook</a>
        </div>
        <p>© 2025 Blog Post</p>
      </div>
    </footer>

    <script>
      const authToken = localStorage.getItem("token");
      if (!authToken) {
        window.location.href = "index.html";
      }
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      document.getElementById("dashboard-username").textContent =
        user.username || user.email || "User";

      document.getElementById("show-create-form").onclick = function () {
        const formDiv = document.getElementById("create-post-form");
        formDiv.classList.toggle("hidden");
      };

      document
        .getElementById("post-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const formData = new FormData(e.target);
          const body = Object.fromEntries(formData);
          const res = await fetch("http://localhost:3600/blogs", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${authToken}`,
            },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          alert(data.message || "Post created!");
          e.target.reset();
          document.getElementById("create-post-form").classList.add("hidden");
          fetchUserPosts();
        });

      const POSTS_PER_PAGE = 5;
      let currentPage = 1;
      let totalPages = 1;
      let allPosts = [];

      function renderUserPosts() {
        const postsDiv = document.getElementById("user-posts");
        postsDiv.innerHTML = "";
        if (allPosts.length > 0) {
          const start = (currentPage - 1) * POSTS_PER_PAGE;
          const end = start + POSTS_PER_PAGE;
          allPosts.slice(start, end).forEach((post) => {
            const div = document.createElement("div");
            div.className = "bg-white rounded-lg shadow-md px-8 py-6";
            div.innerHTML = `
              <div class="flex items-center justify-between">
                <span class="font-light text-gray-600">${new Date(
                  post.created_at
                ).toLocaleDateString(undefined, {
                  month: "short",
                  day: "numeric",
                  year: "numeric",
                })}</span>
                <span class="px-2 py-1 font-bold text-white bg-purple-600 rounded">${
                  post.category || "General"
                }</span>
              </div>
              <div class="mt-2">
                <h4 class="text-2xl font-bold text-gray-800">${post.title}</h4>
                <p class="mt-2 text-gray-600">${post.content}</p>
              </div>
              <div class="flex items-center justify-between mt-4">
                <div class="flex items-center gap-4">
                  <span class="flex items-center gap-1 text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" /></svg>
                    <span id="like-count-${post.id}">0 likes</span>
                  </span>
                  <span class="flex items-center gap-1 text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M18 10c0 3.866-3.582 7-8 7a8.96 8.96 0 01-4.688-1.313L2 17l1.313-3.312A7.963 7.963 0 012 10c0-3.866 3.582-7 8-7s8 3.134 8 7z" /></svg>
                    <span id="comment-count-${post.id}">0 comments</span>
                  </span>
                </div>
                <div>
                  <button class="edit-btn text-blue-600 hover:underline mr-4" data-id="${
                    post.id
                  }">Edit</button>
                  <button class="delete-btn text-red-600 hover:underline" data-id="${
                    post.id
                  }">Delete</button>
                </div>
              </div>
            `;
            postsDiv.appendChild(div);

            // Fetch and display likes count
            fetch(`http://localhost:3600/blogs/${post.id}/likes`)
              .then((res) => res.json())
              .then((data) => {
                if (data && data.success) {
                  document.getElementById(`like-count-${post.id}`).textContent =
                    `${data.total_likes} like${
                      data.total_likes === 1 ? "" : "s"
                    }`;
                }
              });

            // Fetch and display comments count
            fetch(`http://localhost:3600/blogs/${post.id}/comments`)
              .then((res) => res.json())
              .then((data) => {
                if (data && data.success && Array.isArray(data.comments)) {
                  document.getElementById(
                    `comment-count-${post.id}`
                  ).textContent = `${data.comments.length} comment${
                    data.comments.length === 1 ? "" : "s"
                  }`;
                }
              });
          });
        } else {
          postsDiv.innerHTML =
            "<p class='text-gray-500'>No blog posts found for your account.</p>";
        }
        updatePaginationControls();
        attachActionListeners();
      }

      function updatePaginationControls() {
        document.getElementById("prev-page").disabled = currentPage === 1;
        document.getElementById("next-page").disabled =
          currentPage === totalPages || totalPages === 0;
        const pageNumbers = document.getElementById("page-numbers");
        pageNumbers.innerHTML = "";
        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement("button");
          btn.textContent = i;
          btn.className =
            "px-3 py-1 rounded border border-purple-300 mx-1 text-purple-700 font-semibold transition " +
            (i === currentPage
              ? "bg-purple-600 text-white"
              : "bg-white hover:bg-purple-100");
          btn.onclick = function () {
            currentPage = i;
            renderUserPosts();
          };
          pageNumbers.appendChild(btn);
        }
      }

      document.getElementById("prev-page").onclick = function () {
        if (currentPage > 1) {
          currentPage--;
          renderUserPosts();
        }
      };

      document.getElementById("next-page").onclick = function () {
        if (currentPage < totalPages) {
          currentPage++;
          renderUserPosts();
        }
      };

      function attachActionListeners() {
        document.querySelectorAll(".delete-btn").forEach((btn) => {
          btn.onclick = async function () {
            if (confirm("Are you sure you want to delete this post?")) {
              const postId = btn.getAttribute("data-id");
              const res = await fetch(`http://localhost:3600/blogs/${postId}`, {
                method: "DELETE",
                headers: {
                  Authorization: `Bearer ${authToken}`,
                },
              });
              const result = await res.json();
              alert(result.message || "Post deleted!");
              fetchUserPosts();
            }
          };
        });
        // Add edit functionality here if needed
      }

      function fetchUserPosts() {
        fetch("http://localhost:3600/blogs/my/post", {
          headers: {
            Authorization: `Bearer ${authToken}`,
          },
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success && data.data && data.data.length > 0) {
              allPosts = data.data;
              totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);
            } else {
              allPosts = [];
              totalPages = 1;
            }
            renderUserPosts();
          });
      }

      fetchUserPosts();

      // Logout
      document.getElementById("logout-btn").onclick = function () {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      };

      // Dark Mode Theme Logic
      const themeToggle = document.getElementById("theme-toggle");
      const body = document.body;

      function setTheme(isDark) {
        if (isDark) {
          body.classList.add("dark");
          body.classList.remove("bg-gray-100", "text-gray-900");
          body.classList.add("bg-gray-900", "text-gray-100");
          themeToggle.textContent = "Light Mode";
        } else {
          body.classList.remove("dark");
          body.classList.remove("bg-gray-900", "text-gray-100");
          body.classList.add("bg-gray-100", "text-gray-900");
          themeToggle.textContent = "Dark Mode";
        }
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }

      setTheme(localStorage.getItem("theme") === "dark");
      themeToggle.addEventListener("click", () => {
        const isDark = !body.classList.contains("dark");
        setTheme(isDark);
      });
    </script>
  </body>
</html>
