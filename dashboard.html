<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tailwindcss/typography@0.5.10/dist/typography.min.css"
    />
  </head>
  <header
    class="bg-gradient-to-r from-purple-700 to-purple-500 text-white py-5 shadow-md sticky top-0 z-50"
  >
    <div class="container mx-auto px-4 flex justify-between items-center">
      <h1 class="text-3xl font-bold tracking-wide">THOUGHT NEST</h1>
      <nav>
        <ul class="flex gap-6 text-lg font-medium">
          <li><a href="index.html" class="hover:underline">HOME</a></li>
          <li><a href="blog.html" class="hover:underline">BLOG</a></li>
          <li>
            <a href="admin-dashboard.html" class="hover:underline font-bold"
              >ADMIN</a
            >
          </li>
          <!-- <li><a href="about.html" class="hover:underline">About</a></li>
            <li><a href="contact.html" class="hover:underline">Contact</a></li> -->
        </ul>
      </nav>
    </div>
  </header>
  //
  <body
    class="bg-gradient-to-br from-purple-100 via-purple-200 to-purple-300 text-gray-900 font-sans"
  >
    <div class="max-w-3xl mx-auto my-10 bg-white/90 p-8 rounded-lg shadow-lg">
      <h2 class="text-3xl font-bold text-purple-800 mb-4">
        Welcome, <span id="dashboard-username"></span>!
      </h2>
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-semibold text-purple-700">Your Blog Posts</h3>
        <button id="show-create-form" class="btn-primary">Create Post</button>
      </div>
      <div id="create-post-form" class="mb-6 hidden">
        <form
          id="post-form"
          class="space-y-4 bg-purple-50 p-4 rounded-lg shadow"
        >
          <input
            type="text"
            name="title"
            placeholder="Title"
            required
            class="w-full p-3 border border-purple-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
          />
          <textarea
            name="content"
            placeholder="Content"
            required
            class="w-full p-3 border border-purple-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
          ></textarea>
          <input
            type="number"
            name="blog_category_id"
            placeholder="Category ID"
            required
            class="w-full p-3 border border-purple-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"
          />
          <button type="submit" class="btn-primary">Post</button>
        </form>
      </div>
      <div id="user-posts" class="space-y-4"></div>
      <div
        class="flex justify-center items-center gap-2 mt-8"
        id="pagination-controls"
      >
        <button id="prev-page" class="btn-primary px-4 py-2" disabled>
          Prev
        </button>
        <span id="page-numbers" class="flex gap-1"></span>
        <button id="next-page" class="btn-primary px-4 py-2" disabled>
          Next
        </button>
      </div>
      <button id="logout-btn" class="btn-primary mt-6">Logout</button>
    </div>
    <script>
      const authToken = localStorage.getItem("token");
      if (!authToken) {
        window.location.href = "index.html";
      }
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      document.getElementById("dashboard-username").textContent =
        user.username || user.email || "User";

      document.getElementById("show-create-form").onclick = function () {
        const formDiv = document.getElementById("create-post-form");
        formDiv.classList.toggle("hidden");
      };

      document
        .getElementById("post-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const formData = new FormData(e.target);
          const body = Object.fromEntries(formData);
          const res = await fetch("http://localhost:3600/blogs", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${authToken}`,
            },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          alert(data.message || "Post created!");
          e.target.reset();
          document.getElementById("create-post-form").classList.add("hidden");
          fetchUserPosts();
        });

      const POSTS_PER_PAGE = 5;
      let currentPage = 1;
      let totalPages = 1;
      let allPosts = [];

      // Helper: Check if user is logged in
      function isLoggedIn() {
        return !!localStorage.getItem("token");
      }

      // Helper: Like a post
      async function likePost(postId) {
        const res = await fetch(`http://localhost:3600/blogs/${postId}/like`, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${authToken}`,
          },
        });
        const data = await res.json();
        alert(data.message || "Liked!");
        fetchUserPosts();
      }

      // Helper: Comment on a post
      async function commentOnPost(postId, comment) {
        const res = await fetch(
          `http://localhost:3600/blogs/${postId}/comment`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${authToken}`,
            },
            body: JSON.stringify({ comment }),
          }
        );
        const data = await res.json();
        alert(data.message || "Comment added!");
        fetchUserPosts();
      }

      function renderUserPosts() {
        const postsDiv = document.getElementById("user-posts");
        postsDiv.innerHTML = "";
        if (allPosts.length > 0) {
          const start = (currentPage - 1) * POSTS_PER_PAGE;
          const end = start + POSTS_PER_PAGE;
          allPosts.slice(start, end).forEach((post) => {
            const div = document.createElement("div");
            div.className = "bg-gray-50 p-4 rounded shadow";
            div.innerHTML = `
              <h4 class="font-bold mb-2">${post.title}</h4>
              <div class="prose prose-p:mb-2 prose-p:whitespace-pre-line text-justify text-gray-800 mb-2" style="white-space:pre-line;">
                ${post.content}
              </div>
              <span class="text-xs text-gray-500">${new Date(
                post.created_at
              ).toLocaleString()}</span>
              <span class="text-xs bg-purple-200 text-purple-800 px-2 py-1 rounded-full">Category: ${
                post.category || ""
              }</span>
             <button class="btn-danger ml-80 mt-2 self-start" data-id="${
               post.id
             }">Delete</button>
             <div class="mt-4 flex items-center gap-4">
               <button class="like-btn text-purple-700 underline" data-id="${
                 post.id
               }" ${isLoggedIn() ? "" : "disabled"}>Like</button>
               <span class="like-count text-xs text-gray-600" id="like-count-${
                 post.id
               }"></span>
             </div>
             <div class="mt-2">
               <form class="comment-form flex gap-2" data-id="${post.id}">
                 <input type="text" name="comment" placeholder="Add a comment..." class="border rounded px-2 py-1 flex-1" ${
                   isLoggedIn() ? "" : "disabled"
                 } />
                 <button type="submit" class="text-purple-700 underline" ${
                   isLoggedIn() ? "" : "disabled"
                 }>Comment</button>
               </form>
               <div class="comments-list mt-2" id="comments-list-${
                 post.id
               }"></div>
             </div>
            `;
            postsDiv.appendChild(div);

            // Fetch and display likes for each post
            fetch(`http://localhost:3600/blogs/${post.id}/likes`)
              .then((res) => res.json())
              .then((data) => {
                const likeCountSpan = document.getElementById(
                  `like-count-${post.id}`
                );
                if (likeCountSpan) {
                  if (data && data.success && typeof data.count === "number") {
                    likeCountSpan.textContent = `${data.count} like${
                      data.count === 1 ? "" : "s"
                    }`;
                  } else {
                    likeCountSpan.textContent = "0 likes";
                  }
                }
              })
              .catch(() => {
                const likeCountSpan = document.getElementById(
                  `like-count-${post.id}`
                );
                if (likeCountSpan) likeCountSpan.textContent = "0 likes";
              });

            // Fetch and display comments for each post
            fetch(`http://localhost:3600/blogs/${post.id}/comments`)
              .then((res) => res.json())
              .then((data) => {
                const commentsDiv = document.getElementById(
                  `comments-list-${post.id}`
                );
                if (
                  data.success &&
                  Array.isArray(data.data) &&
                  data.data.length > 0
                ) {
                  commentsDiv.innerHTML =
                    `<div class="font-semibold mb-1">Comments:</div>` +
                    data.data
                      .map(
                        (c) =>
                          `<div class="text-xs text-gray-800 mb-1"><span class="font-semibold">${c.username}:</span> ${c.comment}</div>`
                      )
                      .join("");
                } else {
                  commentsDiv.innerHTML = `<div class="text-xs text-gray-400">No comments yet.</div>`;
                }
              });
          });
        } else {
          postsDiv.innerHTML = "<p>No blog posts found for your account.</p>";
        }
        updatePaginationControls();
        attachDeleteListeners();

        // Attach like and comment listeners
        document.querySelectorAll(".like-btn").forEach((btn) => {
          btn.onclick = function () {
            if (!isLoggedIn()) {
              alert("You must be logged in to like a post.");
              return;
            }
            likePost(this.dataset.id);
          };
        });

        document.querySelectorAll(".comment-form").forEach((form) => {
          form.onsubmit = function (e) {
            e.preventDefault();
            if (!isLoggedIn()) {
              alert("You must be logged in to comment.");
              return;
            }
            const comment = this.comment.value.trim();
            if (comment) {
              commentOnPost(this.dataset.id, comment);
              this.comment.value = "";
            }
          };
        });
      }

      function updatePaginationControls() {
        document.getElementById("prev-page").disabled = currentPage === 1;
        document.getElementById("next-page").disabled =
          currentPage === totalPages || totalPages === 0;
        const pageNumbers = document.getElementById("page-numbers");
        pageNumbers.innerHTML = "";
        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement("button");
          btn.textContent = i;
          btn.className =
            "px-3 py-1 rounded border border-purple-300 mx-1 text-purple-700 font-semibold transition " +
            (i === currentPage
              ? "bg-purple-600 text-white"
              : "bg-white hover:bg-purple-100");
          btn.onclick = function () {
            currentPage = i;
            renderUserPosts();
          };
          pageNumbers.appendChild(btn);
        }
      }

      document.getElementById("prev-page").onclick = function () {
        if (currentPage > 1) {
          currentPage--;
          renderUserPosts();
        }
      };

      document.getElementById("next-page").onclick = function () {
        if (currentPage < totalPages) {
          currentPage++;
          renderUserPosts();
        }
      };

      function attachDeleteListeners() {
        document.querySelectorAll(".btn-danger").forEach((btn) => {
          btn.onclick = async function () {
            if (confirm("Are you sure you want to delete this post?")) {
              const postId = btn.getAttribute("data-id");
              const res = await fetch(`http://localhost:3600/blogs/${postId}`, {
                method: "DELETE",
                headers: {
                  Authorization: `Bearer ${authToken}`,
                },
              });
              const result = await res.json();
              alert(result.message || "Post deleted!");
              fetchUserPosts();
            }
          };
        });
      }

      function fetchUserPosts() {
        fetch("http://localhost:3600/blogs/my/post", {
          headers: {
            Authorization: `Bearer ${authToken}`,
          },
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.success && data.data && data.data.length > 0) {
              allPosts = data.data;
              totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);
            } else {
              allPosts = [];
              totalPages = 1;
            }
            renderUserPosts();
          });
      }

      fetchUserPosts();

      // Logout
      document.getElementById("logout-btn").onclick = function () {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      };
    </script>
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      footer {
        margin-top: auto;
      }
      .btn-primary {
        background: #8b5cf6;
        color: #fff;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        transition: background 0.2s;
      }
      .btn-primary:hover {
        background: #7c3aed;
      }
      .btn-danger {
        background: #7c3aed;
        color: #fff;
        font-weight: 600;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        transition: background 0.2s;
      }
      .btn-danger:hover {
        background: #d4223a;
      }
    </style>
    <footer
      class="bg-gradient-to-r from-purple-700 to-purple-900 text-white py-8 mt-10"
    >
      <div class="container mx-auto px-4 text-center space-y-4">
        <div class="flex justify-center gap-6">
          <a href="#" class="hover:text-purple-200">Instagram</a>
          <a href="#" class="hover:text-purple-200">Twitter</a>
          <a href="#" class="hover:text-purple-200">Facebook</a>
        </div>
        <p>© 2025 Blog Post</p>
      </div>
    </footer>
  </body>
</html>
