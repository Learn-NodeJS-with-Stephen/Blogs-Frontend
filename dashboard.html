<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tailwindcss/typography@0.5.10/dist/typography.min.css"
    />
  </head>
  <header
    class="bg-gradient-to-r from-purple-700 to-purple-500 text-white py-5 shadow-md sticky top-0 z-50"
  >
    <div class="container mx-auto px-4 flex justify-between items-center">
      <h1 class="text-3xl font-bold tracking-wide">Blog Post</h1>
      <nav>
        <ul class="flex gap-6 text-lg font-medium">
          <li><a href="index.html" class="hover:underline">Home</a></li>
          <li><a href="blog.html" class="hover:underline">Blog</a></li>
          <li><a href="about.html" class="hover:underline">About</a></li>
          <li><a href="contact.html" class="hover:underline">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <body class="bg-gray-100 text-gray-800 font-sans">
    <div class="max-w-3xl mx-auto my-10 bg-white p-8 rounded shadow">
      <h2 class="text-3xl font-bold text-green-700 mb-4">
        Welcome, <span id="dashboard-username"></span>!
      </h2>
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-semibold">Your Blog Posts</h3>
        <button id="show-create-form" class="btn-primary">Create Post</button>
      </div>
      <div id="create-post-form" class="mb-6 hidden">
        <form id="post-form" class="space-y-4 bg-gray-50 p-4 rounded shadow">
          <input
            type="text"
            name="title"
            placeholder="Title"
            required
            class="w-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400"
          />
          <textarea
            name="content"
            placeholder="Content"
            required
            class="w-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400"
          ></textarea>
          <input
            type="number"
            name="blog_category_id"
            placeholder="Category ID"
            required
            class="w-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400"
          />
          <button type="submit" class="btn-primary">Post</button>
        </form>
      </div>
      <div id="user-posts" class="space-y-4"></div>
      <button id="logout-btn" class="btn-primary mt-6">Logout</button>
    </div>
    <script>
      // Get token and user info from localStorage
      const authToken = localStorage.getItem("token");
      if (!authToken) {
        window.location.href = "index.html";
      }
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      document.getElementById("dashboard-username").textContent =
        user.username || user.email || "User";

      // Show/hide create post form
      document.getElementById("show-create-form").onclick = function () {
        const formDiv = document.getElementById("create-post-form");
        formDiv.classList.toggle("hidden");
      };

      // Handle create post form submission
      document
        .getElementById("post-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const formData = new FormData(e.target);
          const body = Object.fromEntries(formData);
          const res = await fetch("http://localhost:3600/blogs", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${authToken}`,
            },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          alert(data.message || "Post created!");
          e.target.reset();
          document.getElementById("create-post-form").classList.add("hidden");
          fetchUserPosts();
        });

      // Fetch and display user's posts
      function fetchUserPosts() {
        fetch("http://localhost:3600/blogs/my/post", {
          headers: {
            Authorization: `Bearer ${authToken}`,
          },
        })
          .then((res) => res.json())
          .then((data) => {
            const postsDiv = document.getElementById("user-posts");
            postsDiv.innerHTML = "";
            if (data.success && data.data && data.data.length > 0) {
              data.data.forEach((post) => {
                const div = document.createElement("div");
                div.className = "bg-gray-50 p-4 rounded shadow";
                div.innerHTML = `
                  <h4 class="font-bold mb-2">${post.title}</h4>
                  <div class="prose prose-p:mb-2 prose-p:whitespace-pre-line text-justify text-gray-800 mb-2" style="white-space:pre-line;">
                    ${post.content}
                  </div>
                  <span class="text-xs text-gray-500">${new Date(
                    post.created_at
                  ).toLocaleString()}</span>
                  <span class="text-xs text-pink-600 block mt-1">Category: ${
                    post.category || ""
                  }</span>
                  <button class="btn-danger mt-2" data-id="${
                    post.id
                  }">Delete</button>
                `;
                postsDiv.appendChild(div);
              });

              // Add delete event listeners
              document.querySelectorAll(".btn-danger").forEach((btn) => {
                btn.onclick = async function () {
                  if (confirm("Are you sure you want to delete this post?")) {
                    const postId = btn.getAttribute("data-id");
                    const res = await fetch(
                      `http://localhost:3600/blogs/${postId}`,
                      {
                        method: "DELETE",
                        headers: {
                          Authorization: `Bearer ${authToken}`,
                        },
                      }
                    );
                    const result = await res.json();
                    alert(result.message || "Post deleted!");
                    fetchUserPosts();
                  }
                };
              });
            } else {
              postsDiv.innerHTML =
                "<p>No blog posts found for your account.</p>";
            }
          });
      }

      fetchUserPosts();

      // Logout
      document.getElementById("logout-btn").onclick = function () {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      };
    </script>
    <style>
      .btn-primary {
        background: #ec4899;
        color: #fff;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        transition: background 0.2s;
      }
      .btn-primary:hover {
        background: #db2777;
      }
      .btn-danger {
        background: #ef4444;
        color: #fff;
        font-weight: 600;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        margin-top: 0.5rem;
        transition: background 0.2s;
      }
      .btn-danger:hover {
        background: #b91c1c;
      }
    </style>
    <footer
      class="bg-gradient-to-r from-purple-700 to-purple-900 text-white py-8 mt-10"
    >
      <div class="container mx-auto px-4 text-center space-y-4">
        <div class="flex justify-center gap-6">
          <a href="#" class="hover:text-purple-200">Instagram</a>
          <a href="#" class="hover:text-purple-200">Twitter</a>
          <a href="#" class="hover:text-purple-200">Facebook</a>
        </div>
        <p>© 2025 Blog Post</p>
      </div>
    </footer>
  </body>
</html>
