<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Blog Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white text-gray-800 font-sans">
    <div
      class="min-h-screen flex items-center justify-center bg-gradient-to-r from-yellow-50 to-gray-100 px-4"
    >
      <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-xl">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">Sign In</h2>
        <form id="login-form" class="space-y-4">
          <input
            type="text"
            name="username"
            placeholder="Username or Email"
            required
            class="w-full p-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-yellow-400"
          />
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
            class="w-full p-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-yellow-400"
          />
          <button
            type="submit"
            class="w-full py-3 bg-yellow-400 hover:bg-yellow-500 text-white rounded-full font-semibold transition-all"
          >
            Sign In
          </button>
        </form>
        <div
          class="flex items-center justify-between text-sm text-gray-500 mt-4"
        >
          <a href="index.html" class="hover:underline"
            >Don't have an account? Sign up</a
          >
        </div>
      </div>
    </div>
    <script>
      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          const body = Object.fromEntries(formData);

          const res = await fetch("http://localhost:3600/users/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          const data = await res.json();
          if (data.success && data.token) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user || body));
            window.location.href = "dashboard.html";
          } else {
            alert("Login failed!");
          }
        });
    </script>
  </body>
</html>
