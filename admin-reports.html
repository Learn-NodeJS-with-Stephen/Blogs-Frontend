<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Reports & Flags</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/Loopple/loopple-public-assets@main/riva-dashboard-tailwind/riva-dashboard.css"
    />
  </head>
  <body class="bg-white text-black font-sans min-h-screen flex flex-col">
    <div class="flex flex-1 min-h-0">
      <!-- Sidebar (matches admin-dashboard.html) -->
      <aside class="w-64 bg-zinc-900 text-white min-h-screen p-6">
        <div class="mb-10">
          <h1 class="text-2xl font-bold tracking-wide mb-2">Admin Panel</h1>
          <span class="text-zinc-400 text-sm">Thought Nest</span>
        </div>
        <!-- Admin Profile Section -->
        <div class="flex flex-col items-center mb-8">
          <img
            id="admin-avatar"
            src="https://ui-avatars.com/api/?name=Admin&background=random"
            alt="Admin Avatar"
            class="w-16 h-16 rounded-full mb-2"
          />
          <h2 id="admin-username" class="font-semibold text-lg text-teal-400">
            Admin User
          </h2>
          <p class="text-xs text-gray-300">Administrator</p>
        </div>
        <nav class="flex-1">
          <ul class="space-y-2 text-lg font-medium">
            <li>
              <a
                href="admin-dashboard.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-bar-chart"></i></span> Dashboard</a
              >
            </li>
            <li>
              <a
                href="admin-users.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-user"></i></span> Users</a
              >
            </li>
            <li>
              <a
                href="admin-posts.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-file"></i></span> Posts</a
              >
            </li>
            <li>
              <a
                href="admin-categories.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-category"></i></span> Categories</a
              >
            </li>
            <li>
              <a
                href="admin-reports.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-flag"></i></span> Report/Flags</a
              >
            </li>
            <li>
              <a
                href="admin-profile.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-user-circle"></i></span> Profile</a
              >
            </li>
            <li>
              <a
                href="#"
                onclick="logout()"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-log-out"></i></span> Logout</a
              >
            </li>
          </ul>
        </nav>
      </aside>
      <main class="flex-1 px-6 py-10 bg-white text-black min-h-screen">
        <h2 class="text-2xl font-bold mb-6">Restricted Posts & Users</h2>
        <!-- Loopple/Riva Dashboard Table Style -->
        <div class="flex flex-wrap -mx-3 mb-5">
          <div class="w-full max-w-full px-3 mb-6 mx-auto">
            <div
              class="relative flex-[1_auto] flex flex-col break-words min-w-0 bg-clip-border rounded-[.95rem] bg-white m-5"
            >
              <div
                class="relative flex flex-col min-w-0 break-words border border-dashed bg-clip-border rounded-2xl border-stone-200 bg-light/30"
              >
                <!-- card header -->
                <div
                  class="px-9 pt-5 flex justify-between items-stretch flex-wrap min-h-[70px] pb-0 bg-transparent"
                >
                  <h3
                    class="flex flex-col items-start justify-center m-2 ml-0 font-medium text-xl/tight text-dark"
                  >
                    <span class="mr-3 font-semibold text-dark"
                      >Restricted Posts</span
                    >
                  </h3>
                </div>
                <!-- end card header -->
                <!-- card body  -->
                <div class="flex-auto block py-8 pt-6 px-9">
                  <div class="overflow-x-auto">
                    <table
                      class="w-full my-0 align-middle text-dark border-neutral-200"
                    >
                      <thead class="align-bottom">
                        <tr
                          class="font-semibold text-[0.95rem] text-secondary-dark"
                        >
                          <th class="pb-3 text-start min-w-[175px]">
                            Post Title
                          </th>
                          <th class="pb-3 text-end min-w-[100px]">Post ID</th>
                          <th class="pb-3 text-end min-w-[100px]">Reason</th>
                          <th class="pb-3 pr-12 text-end min-w-[175px]">
                            Restricted By
                          </th>
                          <th class="pb-3 pr-12 text-end min-w-[100px]">
                            Date
                          </th>
                        </tr>
                      </thead>
                      <tbody id="restricted-posts-table">
                        <!-- Restricted posts will be rendered here -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="flex flex-wrap -mx-3 mb-5">
          <div class="w-full max-w-full px-3 mb-6 mx-auto">
            <div
              class="relative flex-[1_auto] flex flex-col break-words min-w-0 bg-clip-border rounded-[.95rem] bg-white m-5"
            >
              <div
                class="relative flex flex-col min-w-0 break-words border border-dashed bg-clip-border rounded-2xl border-stone-200 bg-light/30"
              >
                <!-- card header -->
                <div
                  class="px-9 pt-5 flex justify-between items-stretch flex-wrap min-h-[70px] pb-0 bg-transparent"
                >
                  <h3
                    class="flex flex-col items-start justify-center m-2 ml-0 font-medium text-xl/tight text-dark"
                  >
                    <span class="mr-3 font-semibold text-dark"
                      >Restricted Users</span
                    >
                  </h3>
                </div>
                <!-- end card header -->
                <!-- card body  -->
                <div class="flex-auto block py-8 pt-6 px-9">
                  <div class="overflow-x-auto">
                    <table
                      class="w-full my-0 align-middle text-dark border-neutral-200"
                    >
                      <thead class="align-bottom">
                        <tr
                          class="font-semibold text-[0.95rem] text-secondary-dark"
                        >
                          <th class="pb-3 text-start min-w-[175px]">
                            Username
                          </th>
                          <th class="pb-3 text-end min-w-[100px]">User ID</th>
                          <th class="pb-3 text-end min-w-[100px]">Reason</th>
                          <th class="pb-3 pr-12 text-end min-w-[175px]">
                            Restricted By
                          </th>
                          <th class="pb-3 pr-12 text-end min-w-[100px]">
                            Date
                          </th>
                        </tr>
                      </thead>
                      <tbody id="restricted-users-table">
                        <!-- Restricted users will be rendered here -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script>
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "blog.html";
      }

      // Fetch restricted users from backend
      async function loadRestrictedUsers() {
        const usersTbody = document.getElementById("restricted-users-table");
        usersTbody.innerHTML = "";
        try {
          const res = await fetch("http://localhost:3600/admin/users", {
            headers: {
              Authorization: "Bearer " + localStorage.getItem("token"),
            },
          });
          if (!res.ok) {
            usersTbody.innerHTML = `<tr><td colspan="5" class="py-2 px-4 text-red-600">Failed to load restricted users.</td></tr>`;
            return;
          }
          const data = await res.json();
          if (data.success && Array.isArray(data.data)) {
            if (data.data.length === 0) {
              usersTbody.innerHTML = `<tr><td colspan="5" class="py-2 px-4 text-gray-500">No restricted users.</td></tr>`;
            } else {
              data.data.forEach((user, idx) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                  <td class="p-3 pl-0 text-start">${user.username}</td>
                  <td class="p-3 pr-0 text-end">${user.id}</td>
                  <td class="p-3 pr-0 text-end">${
                    user.restriction_reason || "Restricted by admin"
                  }</td>
                  <td class="p-3 pr-12 text-end">${
                    user.restricted_by || "Admin"
                  }</td>
                  <td class="p-3 pr-12 text-end">${
                    user.restricted_at
                      ? new Date(user.restricted_at).toLocaleDateString()
                      : ""
                  }</td>
                `;
                usersTbody.appendChild(tr);
              });
            }
          } else {
            usersTbody.innerHTML = `<tr><td colspan="5" class="py-2 px-4 text-red-600">Failed to load restricted users.</td></tr>`;
          }
        } catch (err) {
          usersTbody.innerHTML = `<tr><td colspan="5" class="py-2 px-4 text-red-600">Failed to load restricted users.</td></tr>`;
        }
      }

      // Fetch restricted posts from backend
      async function loadRestrictedPosts() {
        const postsTbody = document.getElementById("restricted-posts-table");
        postsTbody.innerHTML = "";
        try {
          const res = await fetch(
            "http://localhost:3600/admin/posts/restricted",
            {
              headers: {
                Authorization: "Bearer " + localStorage.getItem("token"),
              },
            }
          );
          if (!res.ok) {
            postsTbody.innerHTML = `<tr><td colspan="5" class="py-2 px-4 text-red-600">Failed to load restricted posts.</td></tr>`;
            return;
          }
          const data = await res.json();
          if (data.success && Array.isArray(data.data)) {
            if (data.data.length === 0) {
              postsTbody.innerHTML = `<tr><td colspan="5" class="py-2 px-4 text-gray-500">No restricted posts.</td></tr>`;
            } else {
              data.data.forEach((post, idx) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                  <td class="p-3 pl-0 text-start">${post.title}</td>
                  <td class="p-3 pr-0 text-end">${post.id}</td>
                  <td class="p-3 pr-0 text-end">${
                    post.restriction_reason || "Restricted by admin"
                  }</td>
                  <td class="p-3 pr-12 text-end">${
                    post.restricted_by || "Admin"
                  }</td>
                  <td class="p-3 pr-12 text-end">${
                    post.restricted_at
                      ? new Date(post.restricted_at).toLocaleDateString()
                      : ""
                  }</td>
                `;
                postsTbody.appendChild(tr);
              });
            }
          } else {
            postsTbody.innerHTML = `<tr><td colspan="5" class="py-2 px-4 text-red-600">Failed to load restricted posts.</td></tr>`;
          }
        } catch (err) {
          postsTbody.innerHTML = `<tr><td colspan="5" class="py-2 px-4 text-red-600">Failed to load restricted posts.</td></tr>`;
        }
      }

      // Show admin profile info in sidebar
      document.addEventListener("DOMContentLoaded", function () {
        const user = JSON.parse(localStorage.getItem("user") || "{}");
        if (user && user.username) {
          document.getElementById("admin-username").textContent = user.username;
          document.getElementById("admin-avatar").src =
            user.avatar ||
            `https://ui-avatars.com/api/?name=${encodeURIComponent(
              user.username
            )}&background=random`;
        }
      });

      // Initial render
      loadRestrictedPosts();
      loadRestrictedUsers();
    </script>
  </body>
</html>
