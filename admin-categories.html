<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Categories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/Loopple/loopple-public-assets@main/riva-dashboard-tailwind/riva-dashboard.css"
    />
    <style>
      body {
        min-height: 100vh;
      }
      main {
        margin-left: 16rem;
      }
    </style>
  </head>
  <body class="bg-white text-black font-sans min-h-screen">
    <!-- Sidebar (same as your other admin pages) -->
    <aside
      class="w-64 bg-zinc-900 text-white min-h-screen p-6 fixed inset-y-0 left-0"
    >
      <div class="mb-10">
        <h1 class="text-2xl font-bold tracking-wide mb-2">Admin Panel</h1>
        <span class="text-zinc-400 text-sm">Thought Nest</span>
      </div>
      <!-- Admin Profile Section -->
      <div class="flex flex-col items-center mb-8">
        <img
          id="admin-avatar"
          src="https://ui-avatars.com/api/?name=Admin&background=random"
          alt="Admin Avatar"
          class="w-16 h-16 rounded-full mb-2"
        />
        <h2 id="admin-username" class="font-semibold text-lg text-teal-400">
          Admin User
        </h2>
        <p class="text-xs text-gray-300">Administrator</p>
      </div>
      <nav class="flex-1">
        <ul class="space-y-2 text-lg font-medium">
          <li>
            <a
              href="admin-dashboard.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-bar-chart"></i></span> Dashboard
            </a>
          </li>
          <li>
            <a
              href="admin-users.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-user"></i></span> Users
            </a>
          </li>
          <li>
            <a
              href="admin-posts.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-file"></i></span> Posts
            </a>
          </li>
          <li>
            <a
              href="admin-categories.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-category"></i></span> Categories
            </a>
          </li>
          <li>
            <a
              href="admin-reports.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-flag"></i></span> Report/Flags
            </a>
          </li>
          <li>
            <a
              href="admin-profile.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-user-circle"></i></span> Profile
            </a>
          </li>
          <li>
            <a
              href="#"
              onclick="logout()"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-log-out"></i></span> Logout
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="p-8">
      <h2 class="text-2xl font-bold mb-6">Categories</h2>
      <!-- Categories Table with Add Category and Search Bar in Header -->
      <div
        class="relative flex-[1_auto] flex flex-col break-words min-w-0 bg-clip-border rounded-[.95rem] bg-white m-5"
      >
        <div
          class="relative flex flex-col min-w-0 break-words border border-dashed bg-clip-border rounded-2xl border-stone-200 bg-light/30"
        >
          <div
            class="px-9 pt-5 flex justify-between items-center flex-wrap min-h-[70px] pb-0 bg-transparent"
          >
            <h3
              class="flex flex-col items-start justify-center m-2 ml-0 font-medium text-xl/tight text-dark"
            >
              <span class="mr-3 font-semibold text-dark">Category Table</span>
            </h3>
            <!-- Add Category and Search Bar -->
            <div
              class="flex flex-col sm:flex-row gap-2 items-end sm:items-center mb-0 w-full sm:w-auto"
            >
              <form id="create-category-form" class="flex gap-2">
                <input
                  type="text"
                  id="category-name"
                  class="input border border-gray-300 rounded px-4 py-2"
                  placeholder="New category name"
                  required
                />
                <button
                  type="submit"
                  class="btn-primary px-4 py-2 rounded font-bold text-white bg-blue-600 hover:bg-blue-700"
                >
                  Add
                </button>
              </form>
              <input
                type="text"
                id="category-search"
                placeholder="Search categories..."
                class="input border border-gray-300 rounded px-4 py-2 w-full sm:w-80"
              />
            </div>
          </div>
          <div class="flex-auto block py-8 pt-6 px-9">
            <div class="overflow-x-auto">
              <table
                class="w-full my-0 align-middle text-dark border-neutral-200"
              >
                <thead class="align-bottom">
                  <tr class="font-semibold text-[0.95rem] text-secondary-dark">
                    <th class="pb-3 text-start min-w-[100px]">No.</th>
                    <th class="pb-3 text-start min-w-[175px]">Category Name</th>
                    <th class="pb-3 text-start min-w-[175px]">Category ID</th>
                    <th class="pb-3 text-end min-w-[100px]">Actions</th>
                  </tr>
                </thead>
                <tbody id="category-table-body">
                  <!-- Categories will be rendered here -->
                </tbody>
              </table>
            </div>
            <!-- Pagination Controls -->
            <div
              class="flex justify-end mt-6 space-x-2"
              id="pagination-controls"
            ></div>
            <div
              id="category-message"
              class="mb-4 text-center font-semibold"
            ></div>
          </div>
        </div>
      </div>
    </main>
    <script>
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "blog.html";
      }

      // Show admin profile info in sidebar
      document.addEventListener("DOMContentLoaded", function () {
        const user = JSON.parse(localStorage.getItem("user") || "{}");
        if (user && user.username) {
          document.getElementById("admin-username").textContent = user.username;
          document.getElementById("admin-avatar").src =
            user.avatar ||
            `https://ui-avatars.com/api/?name=${encodeURIComponent(
              user.username
            )}&background=random`;
        }
      });

      let categoriesData = [];
      let filteredCategories = [];
      let currentPage = 1;
      const pageSize = 7;
      let currentSearch = "";

      // Fetch and render categories in table with pagination and search
      async function loadCategories() {
        const res = await fetch("https://blogs-api-q51w.onrender.com/admin/categories", {
          headers: {
            Authorization: "Bearer " + localStorage.getItem("token"),
          },
        });
        const tableBody = document.getElementById("category-table-body");
        tableBody.innerHTML = "";
        if (!res.ok) {
          tableBody.innerHTML =
            "<tr><td colspan='4' class='py-2 px-4 text-red-600'>Failed to load categories.</td></tr>";
          categoriesData = [];
          filteredCategories = [];
          renderPagination();
          return;
        }
        const data = await res.json();
        if (data.success && Array.isArray(data.data)) {
          categoriesData = data.data;
          filteredCategories = categoriesData;
          if (categoriesData.length === 0) {
            tableBody.innerHTML =
              "<tr><td colspan='4' class='py-2 px-4 text-gray-500'>No categories found.</td></tr>";
          }
          currentPage = 1; // Reset to first page on reload
          renderCategoriesTable();
          renderPagination();
        } else {
          tableBody.innerHTML =
            "<tr><td colspan='4' class='py-2 px-4 text-red-600'>Failed to load categories.</td></tr>";
          categoriesData = [];
          filteredCategories = [];
          renderPagination();
        }
      }

      function renderCategoriesTable() {
        const tableBody = document.getElementById("category-table-body");
        tableBody.innerHTML = "";
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const pageItems = filteredCategories.slice(start, end);

        if (pageItems.length === 0) {
          tableBody.innerHTML =
            "<tr><td colspan='4' class='py-2 px-4 text-gray-500'>No categories found.</td></tr>";
          return;
        }

        pageItems.forEach((cat, idx) => {
          const tr = document.createElement("tr");
          tr.className = "border-b border-dashed last:border-b-0";
          tr.innerHTML = `
            <td class="p-3 pl-0">${start + idx + 1}.</td>
            <td class="p-3 pl-0">${cat.name}</td>
            <td class="p-3 pl-0">${cat.id}</td>
            <td class="p-3 pr-0 text-end">
              <button class="text-red-600 underline ml-2 delete-category-btn" data-id="${
                cat.id
              }">Delete</button>
            </td>
          `;
          tableBody.appendChild(tr);
        });

        // Add delete functionality
        document.querySelectorAll(".delete-category-btn").forEach((btn) => {
          btn.addEventListener("click", async function () {
            if (confirm("Are you sure you want to delete this category?")) {
              const categoryId = this.getAttribute("data-id");
              const res = await fetch(
                `https://blogs-api-q51w.onrender.com/admin/category/${categoryId}`,
                {
                  method: "DELETE",
                  headers: {
                    Authorization: "Bearer " + localStorage.getItem("token"),
                  },
                }
              );
              const result = await res.json();
              if (result.success) {
                await loadCategories();
              } else {
                alert(result.message || "Failed to delete category.");
              }
            }
          });
        });
      }

      function renderPagination() {
        const total = filteredCategories.length;
        const totalPages = Math.ceil(total / pageSize);
        const controls = document.getElementById("pagination-controls");
        controls.innerHTML = "";

        // Previous button
        const prevBtn = document.createElement("button");
        prevBtn.textContent = "Previous";
        prevBtn.className =
          "px-4 py-2 rounded bg-gray-200 text-gray-700 hover:bg-gray-300";
        prevBtn.disabled = currentPage <= 1;
        prevBtn.onclick = () => {
          if (currentPage > 1) {
            currentPage--;
            renderCategoriesTable();
            renderPagination();
          }
        };
        controls.appendChild(prevBtn);

        // Page info
        const pageInfo = document.createElement("span");
        pageInfo.className = "px-4 py-2 font-semibold";
        pageInfo.textContent =
          total === 0
            ? ""
            : `Page ${currentPage} of ${totalPages} (${total} categories)`;
        controls.appendChild(pageInfo);

        // Next button
        const nextBtn = document.createElement("button");
        nextBtn.textContent = "Next";
        nextBtn.className =
          "px-4 py-2 rounded bg-gray-200 text-gray-700 hover:bg-gray-300";
        nextBtn.disabled = currentPage >= totalPages || totalPages === 0;
        nextBtn.onclick = () => {
          if (currentPage < totalPages) {
            currentPage++;
            renderCategoriesTable();
            renderPagination();
          }
        };
        controls.appendChild(nextBtn);
      }

      // Listen for search input
      document
        .getElementById("category-search")
        .addEventListener("input", function () {
          currentSearch = this.value.trim().toLowerCase();
          if (!currentSearch) {
            filteredCategories = categoriesData;
          } else {
            filteredCategories = categoriesData.filter((cat) =>
              cat.name.toLowerCase().includes(currentSearch)
            );
          }
          currentPage = 1;
          renderCategoriesTable();
          renderPagination();
        });

      // Handle create category form
      document.getElementById("create-category-form").onsubmit =
        async function (e) {
          e.preventDefault();
          const name = document.getElementById("category-name").value.trim();
          const msg = document.getElementById("category-message");
          msg.textContent = "";
          if (!name) {
            msg.textContent = "Category name is required.";
            msg.className = "mb-4 text-center font-semibold text-red-600";
            return;
          }
          const res = await fetch("https://blogs-api-q51w.onrender.com/admin/category", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + localStorage.getItem("token"),
            },
            body: JSON.stringify({ name }),
          });
          const data = await res.json();
          if (data.success) {
            msg.textContent = "Category created!";
            msg.className = "mb-4 text-center font-semibold text-green-600";
            document.getElementById("category-name").value = "";
            loadCategories();
          } else {
            msg.textContent =
              data.message || data.error || "Failed to create category.";
            msg.className = "mb-4 text-center font-semibold text-red-600";
          }
        };

      window.onload = loadCategories;
    </script>
  </body>
</html>
