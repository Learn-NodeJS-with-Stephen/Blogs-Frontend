<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Categories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white text-black font-sans min-h-screen flex flex-col">
    <div class="flex flex-1 min-h-0">
      <!-- Sidebar (matches admin-dashboard.html) -->
      <aside
        class="w-64 bg-zinc-900 text-white min-h-screen p-6 fixed inset-y-0 left-0"
      >
        <div class="mb-10">
          <h1 class="text-2xl font-bold tracking-wide mb-2">Admin Panel</h1>
          <span class="text-zinc-400 text-sm">Thought Nest</span>
        </div>
        <!-- Admin Profile Section -->
        <div class="flex flex-col items-center mb-8">
          <img
            id="admin-avatar"
            src="https://ui-avatars.com/api/?name=Admin&background=random"
            alt="Admin Avatar"
            class="w-16 h-16 rounded-full mb-2"
          />
          <h2 id="admin-username" class="font-semibold text-lg text-teal-400">
            Admin User
          </h2>
          <p class="text-xs text-gray-300">Administrator</p>
        </div>
        <nav class="flex-1">
          <ul class="space-y-2 text-lg font-medium">
              <li>
              <a
                href="admin-dashboard.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-bar-chart"></i></span> Dashboard</a
              >
            </li>
            <li>
              <a
                href="admin-users.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-user"></i></span> Users</a
              >
            </li>
            <li>
              <a
                href="admin-posts.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-file"></i></span> Posts</a
              >
            </li>
            <li>
              <a
                href="admin-categories.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-category"></i></span> Categories</a
              >
            </li>
            <li>
              <a
                href="admin-reports.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-flag"></i></span> Report/Flags</a
              >
            </li>
            <li>
              <a
                href="admin-profile.html"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-user-circle"></i></span> Profile</a
              >
            </li>
            <li>
              <a
                href="#"
                onclick="logout()"
                class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
                ><span><i class="bx bx-log-out"></i></span> Logout</a
              >
            </li>
          </ul>
        </nav>
      </aside>
      <main class="flex-1 px-6 py-10 bg-white text-black min-h-screen">
        <h2 class="text-2xl font-bold mb-6">Categories</h2>
        <div class="bg-gray-100 rounded-lg shadow p-6 max-w-xl mx-auto">
          <!-- Create Category Form -->
          <form id="create-category-form" class="flex gap-2 mb-6">
            <input
              type="text"
              id="category-name"
              class="input border border-gray-300 rounded px-4 py-2 flex-1"
              placeholder="New category name"
              required
            />
            <button
              type="submit"
              class="btn-primary px-4 py-2 rounded font-bold text-white bg-blue-600 hover:bg-blue-700"
            >
              Add Category
            </button>
          </form>
          <div
            id="category-message"
            class="mb-4 text-center font-semibold"
          ></div>
          <!-- Category Table -->
          <h3 class="font-semibold mb-2">Category List</h3>
          <table class="w-full border border-gray-300 rounded mb-2 bg-white">
            <thead>
              <tr class="bg-gray-200">
                <th class="py-2 px-4 text-left">No.</th>
                <th class="py-2 px-4 text-left">Category Name</th>
                <th class="py-2 px-4 text-left">Category ID</th>
                <th class="py-2 px-4 text-left">Actions</th>
              </tr>
            </thead>
            <tbody id="category-table-body">
              <!-- Categories will be rendered here -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
    <script>
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      }

      // Fetch and render categories in table
      async function loadCategories() {
        const res = await fetch("http://localhost:3600/admin/categories", {
          headers: {
            Authorization: "Bearer " + localStorage.getItem("token"),
          },
        });
        const tableBody = document.getElementById("category-table-body");
        tableBody.innerHTML = "";
        if (!res.ok) {
          tableBody.innerHTML =
            "<tr><td colspan='4' class='py-2 px-4 text-red-600'>Failed to load categories.</td></tr>";
          return;
        }
        const data = await res.json();
        if (data.success && Array.isArray(data.data)) {
          if (data.data.length === 0) {
            tableBody.innerHTML =
              "<tr><td colspan='4' class='py-2 px-4 text-gray-500'>No categories found.</td></tr>";
          } else {
            data.data.forEach((cat, idx) => {
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td class="py-2 px-4">${idx + 1}.</td>
                <td class="py-2 px-4">${cat.name}</td>
                <td class="py-2 px-4">${cat.id}</td>
                <td class="py-2 px-4">
                  <button class="text-red-600 underline delete-category-btn" data-id="${
                    cat.id
                  }">Delete</button>
                </td>
              `;
              tableBody.appendChild(tr);
            });

            // Add delete functionality
            document.querySelectorAll(".delete-category-btn").forEach((btn) => {
              btn.addEventListener("click", async function () {
                if (confirm("Are you sure you want to delete this category?")) {
                  const categoryId = this.getAttribute("data-id");
                  const res = await fetch(
                    `http://localhost:3600/admin/category/${categoryId}`,
                    {
                      method: "DELETE",
                      headers: {
                        Authorization:
                          "Bearer " + localStorage.getItem("token"),
                      },
                    }
                  );
                  const result = await res.json();
                  if (result.success) {
                    loadCategories();
                  } else {
                    alert(result.message || "Failed to delete category.");
                  }
                }
              });
            });
          }
        } else {
          tableBody.innerHTML =
            "<tr><td colspan='4' class='py-2 px-4 text-red-600'>Failed to load categories.</td></tr>";
        }
      }

      // Handle create category form
      document.getElementById("create-category-form").onsubmit =
        async function (e) {
          e.preventDefault();
          const name = document.getElementById("category-name").value.trim();
          const msg = document.getElementById("category-message");
          msg.textContent = "";
          if (!name) {
            msg.textContent = "Category name is required.";
            msg.className = "mb-4 text-center font-semibold text-red-600";
            return;
          }
          const res = await fetch("http://localhost:3600/admin/category", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + localStorage.getItem("token"),
            },
            body: JSON.stringify({ name }),
          });
          const data = await res.json();
          if (data.success) {
            msg.textContent = "Category created!";
            msg.className = "mb-4 text-center font-semibold text-green-600";
            document.getElementById("category-name").value = "";
            loadCategories();
          } else {
            msg.textContent =
              data.message || data.error || "Failed to create category.";
            msg.className = "mb-4 text-center font-semibold text-red-600";
          }
        };

      window.onload = loadCategories;

      // Show admin profile info in sidebar
      document.addEventListener("DOMContentLoaded", function () {
        const user = JSON.parse(localStorage.getItem("user") || "{}");
        if (user && user.username) {
          document.getElementById("admin-username").textContent = user.username;
          document.getElementById("admin-avatar").src =
            user.avatar ||
            `https://ui-avatars.com/api/?name=${encodeURIComponent(
              user.username
            )}&background=random`;
        }
      });
    </script>
  </body>
</html>
