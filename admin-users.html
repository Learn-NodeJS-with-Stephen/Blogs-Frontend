<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
      }
      main {
        margin-left: 16rem;
      }
    </style>
  </head>
  <body class="bg-white text-black font-sans min-h-screen">
    <!-- Sidebar (same as your other admin pages) -->
    <aside
      class="w-64 bg-zinc-900 text-white min-h-screen p-6 fixed inset-y-0 left-0"
    >
      <div class="mb-10">
        <h1 class="text-2xl font-bold tracking-wide mb-2">Admin Panel</h1>
        <span class="text-zinc-400 text-sm">Thought Nest</span>
      </div>
      <nav class="flex-1">
        <ul class="space-y-2 text-lg font-medium">
          <li class="mb-4">
            <a
              href="index.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-home"></i></span> Home
            </a>
          </li>
          <li>
            <a
              href="admin-dashboard.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-bar-chart"></i></span> Dashboard
            </a>
          </li>
          <li>
            <a
              href="admin-users.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-user"></i></span> Users
            </a>
          </li>
          <li>
            <a
              href="admin-posts.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-file"></i></span> Posts
            </a>
          </li>
          <li>
            <a
              href="admin-categories.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-category"></i></span> Categories
            </a>
          </li>
          <li>
            <a
              href="admin-reports.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-flag"></i></span> Report/Flags
            </a>
          </li>
          <li>
            <a
              href="admin-profile.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-user-circle"></i></span> Profile
            </a>
          </li>
          <li>
            <a
              href="#"
              onclick="logout()"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-log-out"></i></span> Logout
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="p-8">
      <h2 class="text-2xl font-bold mb-6">All Users</h2>
      <!-- Search Bar -->
      <div class="mb-4">
        <input
          type="text"
          id="user-search"
          placeholder="Search users by name or email..."
          class="input w-full max-w-md border border-gray-300 rounded px-4 py-2"
        />
      </div>
      <div class="bg-gray-100 rounded-lg shadow p-6">
        <table class="min-w-full bg-white rounded-lg shadow text-black">
          <thead>
            <tr class="bg-gray-200 text-black">
              <th class="py-2 px-4">No.</th>
              <th class="py-2 px-4">Name</th>
              <th class="py-2 px-4">Email</th>
              <th class="py-2 px-4">Role</th>
              <th class="py-2 px-4">Status</th>
              <th class="py-2 px-4">Actions</th>
            </tr>
          </thead>
          <tbody id="user-table">
            <!-- Users will be rendered here -->
          </tbody>
        </table>
      </div>
    </main>
    <script>
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
      }

      // Fetch and render users, with optional search
      async function loadUsers(query = "") {
        let url = "http://localhost:3600/users/get";
        if (query) {
          url += `?search=${encodeURIComponent(query)}`;
        }
        const res = await fetch(url, {
          headers: {
            Authorization: "Bearer " + localStorage.getItem("token"),
          },
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.success && Array.isArray(data.data)) {
          const tbody = document.getElementById("user-table");
          tbody.innerHTML = "";
          data.data.forEach((user, idx) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td class="py-2 px-4">${idx + 1}</td>
              <td class="py-2 px-4">${user.username}</td>
              <td class="py-2 px-4">${user.email}</td>
              <td class="py-2 px-4">${user.user_type}</td>
              <td class="py-2 px-4">${
                user.is_active ? "Active" : "Suspended"
              }</td>
              <td class="py-2 px-4">
                <button class="text-red-600 underline ml-2 delete-user-btn" data-id="${
                  user.id
                }">Delete</button>
              </td>
            `;
            tbody.appendChild(tr);
          });

          // Add delete functionality
          document.querySelectorAll(".delete-user-btn").forEach((btn) => {
            btn.addEventListener("click", async function () {
              if (confirm("Are you sure you want to delete this user?")) {
                const userId = this.getAttribute("data-id");
                const res = await fetch(
                  `http://localhost:3600/users/${userId}`,
                  {
                    method: "DELETE",
                    headers: {
                      Authorization: "Bearer " + localStorage.getItem("token"),
                    },
                  }
                );
                const result = await res.json();
                if (result.success) {
                  loadUsers(
                    document.getElementById("user-search").value.trim()
                  );
                } else {
                  alert(result.message || "Failed to delete user.");
                }
              }
            });
          });
        }
      }

      // Listen for search input
      document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("user-search");
        searchInput.addEventListener("input", function () {
          loadUsers(this.value.trim());
        });
        loadUsers();
      });
    </script>
  </body>
</html>
