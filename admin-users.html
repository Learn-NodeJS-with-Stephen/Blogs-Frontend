<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/Loopple/loopple-public-assets@main/riva-dashboard-tailwind/riva-dashboard.css"
    />
    <style>
      body {
        min-height: 100vh;
      }
      main {
        margin-left: 16rem;
      }
    </style>
  </head>
  <body class="bg-white text-black font-sans min-h-screen">
    <!-- Sidebar (same as your other admin pages) -->
    <aside
      class="w-64 bg-zinc-900 text-white min-h-screen p-6 fixed inset-y-0 left-0"
    >
      <div class="mb-10">
        <h1 class="text-2xl font-bold tracking-wide mb-2">Admin Panel</h1>
        <span class="text-zinc-400 text-sm">Thought Nest</span>
      </div>
      <!-- Admin Profile Section -->
      <div class="flex flex-col items-center mb-8">
        <img
          id="admin-avatar"
          src="https://ui-avatars.com/api/?name=Admin&background=random"
          alt="Admin Avatar"
          class="w-16 h-16 rounded-full mb-2"
        />
        <h2 id="admin-username" class="font-semibold text-lg text-teal-400">
          Admin User
        </h2>
        <p class="text-xs text-gray-300">Administrator</p>
      </div>
      <nav class="flex-1">
        <ul class="space-y-2 text-lg font-medium">
          <li>
            <a
              href="admin-dashboard.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-bar-chart"></i></span> Dashboard
            </a>
          </li>
          <li>
            <a
              href="admin-users.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-user"></i></span> Users
            </a>
          </li>
          <li>
            <a
              href="admin-posts.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-file"></i></span> Posts
            </a>
          </li>
          <li>
            <a
              href="admin-categories.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-category"></i></span> Categories
            </a>
          </li>
          <li>
            <a
              href="admin-reports.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-flag"></i></span> Report/Flags
            </a>
          </li>
          <li>
            <a
              href="admin-profile.html"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-user-circle"></i></span> Profile
            </a>
          </li>
          <li>
            <a
              href="#"
              onclick="logout()"
              class="flex items-center gap-2 px-3 py-2 rounded hover:bg-zinc-800 transition"
            >
              <span><i class="bx bx-log-out"></i></span> Logout
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="p-8">
      <h2 class="text-2xl font-bold mb-6">All Users</h2>
      <!-- Users Table with Search Bar in Header -->
      <div
        class="relative flex-[1_auto] flex flex-col break-words min-w-0 bg-clip-border rounded-[.95rem] bg-white m-5"
      >
        <div
          class="relative flex flex-col min-w-0 break-words border border-dashed bg-clip-border rounded-2xl border-stone-200 bg-light/30"
        >
          <div
            class="px-9 pt-5 flex justify-between items-center flex-wrap min-h-[70px] pb-0 bg-transparent"
          >
            <h3
              class="flex flex-col items-start justify-center m-2 ml-0 font-medium text-xl/tight text-dark"
            >
              <span class="mr-3 font-semibold text-dark">Users Table</span>
            </h3>
            <!-- Search Bar moved here -->
            <div class="mb-0 w-full sm:w-auto flex justify-end">
              <input
                type="text"
                id="user-search"
                placeholder="Search users by name or email..."
                class="input border border-gray-300 rounded px-4 py-2 w-full sm:w-80"
              />
            </div>
          </div>
          <div class="flex-auto block py-8 pt-6 px-9">
            <div class="overflow-x-auto">
              <table
                class="w-full my-0 align-middle text-dark border-neutral-200"
              >
                <thead class="align-bottom">
                  <tr class="font-semibold text-[0.95rem] text-secondary-dark">
                    <th class="pb-3 text-start min-w-[100px]">No.</th>
                    <th class="pb-3 text-start min-w-[175px]">Name</th>
                    <th class="pb-3 text-start min-w-[175px]">Email</th>
                    <th class="pb-3 text-end min-w-[100px]">Role</th>
                    <th class="pb-3 text-end min-w-[100px]">Status</th>
                    <th class="pb-3 text-end min-w-[100px]">Actions</th>
                  </tr>
                </thead>
                <tbody id="user-table">
                  <!-- Users will be rendered here -->
                </tbody>
              </table>
            </div>
            <!-- Pagination Controls -->
            <div
              class="flex justify-end mt-6 space-x-2"
              id="pagination-controls"
            ></div>
          </div>
        </div>
      </div>
    </main>
    <script>
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "blog.html";
      }

      // Show admin profile info in sidebar
      document.addEventListener("DOMContentLoaded", function () {
        const user = JSON.parse(localStorage.getItem("user") || "{}");
        if (user && user.username) {
          document.getElementById("admin-username").textContent = user.username;
          document.getElementById("admin-avatar").src =
            user.avatar ||
            `https://ui-avatars.com/api/?name=${encodeURIComponent(
              user.username
            )}&background=random`;
        }
      });

      let currentPage = 1;
      let currentSearch = "";

      // Fetch and render users, with pagination and search
      async function loadUsers(page = 1, search = "") {
        currentPage = page;
        const limit = 10;
        let url = `https://blogs-api-q51w.onrender.com/users/get?page=${page}&limit=${limit}`;
        if (search) {
          url += `&search=${encodeURIComponent(search)}`;
        }
        const res = await fetch(url, {
          headers: {
            Authorization: "Bearer " + localStorage.getItem("token"),
          },
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.success && Array.isArray(data.data)) {
          const tbody = document.getElementById("user-table");
          tbody.innerHTML = "";
          data.data.forEach((user, idx) => {
            const tr = document.createElement("tr");
            tr.className = "border-b border-dashed last:border-b-0";
            tr.innerHTML = `
              <td class="p-3 pl-0">${(page - 1) * limit + idx + 1}</td>
              <td class="p-3 pl-0">
                <div class="flex items-center">
                  <div class="relative inline-block shrink-0 rounded-2xl me-3">
                    <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(
                      user.username
                    )}&background=random" class="w-[40px] h-[40px] inline-block shrink-0 rounded-2xl" alt="">
                  </div>
                  <div class="flex flex-col justify-start">
                    <span class="mb-1 font-semibold transition-colors duration-200 ease-in-out text-md/normal text-secondary-inverse hover:text-primary">${
                      user.username
                    }</span>
                  </div>
                </div>
              </td>
              <td class="p-3 pr-0 text-start">${user.email}</td>
              <td class="p-3 pr-0 text-end">${user.user_type}</td>
              <td class="p-3 pr-0 text-end">
                <span class="text-center align-baseline inline-flex px-2 py-1 mr-auto items-center font-semibold text-base/none ${
                  user.is_active
                    ? "text-success bg-success-light"
                    : "text-danger bg-danger-light"
                } rounded-lg">
                  ${user.is_active ? "Active" : "Suspended"}
                </span>
              </td>
              <td class="p-3 pr-0 text-end">
                <button class="text-red-600 underline ml-2 delete-user-btn" data-id="${
                  user.id
                }">Delete</button>
              </td>
            `;
            tbody.appendChild(tr);
          });

          // Add delete functionality
          document.querySelectorAll(".delete-user-btn").forEach((btn) => {
            btn.addEventListener("click", async function () {
              if (confirm("Are you sure you want to delete this user?")) {
                const userId = this.getAttribute("data-id");
                const res = await fetch(
                  `https://blogs-api-q51w.onrender.com/users/${userId}`,
                  {
                    method: "DELETE",
                    headers: {
                      Authorization: "Bearer " + localStorage.getItem("token"),
                    },
                  }
                );
                const result = await res.json();
                if (result.success) {
                  loadUsers(currentPage, currentSearch);
                } else {
                  alert(result.message || "Failed to delete user.");
                }
              }
            });
          });

          // Pagination controls
          renderPagination(data.meta);
        }
      }

      function renderPagination(meta) {
        const controls = document.getElementById("pagination-controls");
        controls.innerHTML = "";
        if (!meta) return;

        // Previous button
        const prevBtn = document.createElement("button");
        prevBtn.textContent = "Previous";
        prevBtn.className =
          "px-4 py-2 rounded bg-gray-200 text-gray-700 hover:bg-gray-300";
        prevBtn.disabled = meta.page <= 1;
        prevBtn.onclick = () => {
          if (meta.page > 1) {
            loadUsers(meta.page - 1, currentSearch);
          }
        };
        controls.appendChild(prevBtn);

        // Page info
        const pageInfo = document.createElement("span");
        pageInfo.className = "px-4 py-2 font-semibold";
        pageInfo.textContent = `Page ${meta.page}`;
        controls.appendChild(pageInfo);

        // Next button
        const nextBtn = document.createElement("button");
        nextBtn.textContent = "Next";
        nextBtn.className =
          "px-4 py-2 rounded bg-gray-200 text-gray-700 hover:bg-gray-300";
        nextBtn.disabled = !meta.hasNext;
        nextBtn.onclick = () => {
          if (meta.hasNext) {
            loadUsers(meta.page + 1, currentSearch);
          }
        };
        controls.appendChild(nextBtn);
      }

      // Listen for search input and initial load
      document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("user-search");
        searchInput.addEventListener("input", function () {
          currentSearch = this.value.trim();
          currentPage = 1;
          loadUsers(currentPage, currentSearch);
        });
        loadUsers();
      });
    </script>
  </body>
</html>
