<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Posts</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white text-black font-sans min-h-screen">
    <header
      class="bg-zinc-900 text-white p-4 flex justify-between items-center"
    >
      <h1 class="text-2xl font-bold">Admin Panel</h1>
      <a href="admin-dashboard.html" class="text-blue-300 underline"
        >Dashboard</a
      >
    </header>
    <main class="max-w-4xl mx-auto py-10">
      <h2 class="text-2xl font-bold mb-6">All Posts</h2>
      <!-- Posts table placeholder -->
      <div class="bg-gray-100 rounded-lg shadow p-6">
        <table class="min-w-full bg-white rounded-lg shadow text-black">
          <thead>
            <tr class="bg-gray-200 text-black">
              <th class="py-2 px-4">Title</th>
              <th class="py-2 px-4">Author</th>
              <th class="py-2 px-4">Category</th>
              <th class="py-2 px-4">Status</th>
              <th class="py-2 px-4">Date</th>
              <th class="py-2 px-4">Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Render posts here with JS or server-side -->
            <tr>
              <td class="py-2 px-4">Sample Post</td>
              <td class="py-2 px-4">John Doe</td>
              <td class="py-2 px-4">Tech</td>
              <td class="py-2 px-4">Published</td>
              <td class="py-2 px-4">2025-08-22</td>
              <td class="py-2 px-4">
                <button class="text-blue-600 underline">Edit</button>
                <button class="text-red-600 underline ml-2">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
