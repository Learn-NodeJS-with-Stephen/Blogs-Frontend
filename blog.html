<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-900 font-sans">
    <header class="bg-white border-b border-gray-200 py-5 sticky top-0 z-50">
      <div class="container mx-auto px-4 flex items-center justify-between">
        <h1 class="text-3xl font-bold tracking-wide text-gray-900">
          THOUGHT NEST
        </h1>
        <!-- Centered Dark Mode Button -->
        <div class="flex-1 flex justify-center">
          <button
            id="theme-toggle"
            class="px-3 py-1 rounded bg-gray-200 text-gray-800 hover:bg-gray-300 transition"
          >
            Dark Mode
          </button>
        </div>
        <!-- Right-aligned Navigation -->
        <nav>
          <ul class="flex gap-6 text-lg font-medium">
            <li>
              <a href="index.html" class="hover:underline text-gray-800"
                >Home</a
              >
            </li>
            <li>
              <a href="blog.html" class="hover:underline text-gray-800">Blog</a>
            </li>
            <li>
              <a href="admin-login.html" class="hover:underline text-gray-800"
                >Admin</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section
      class="max-w-7xl mx-auto mt-10 px-4 flex flex-col lg:flex-row gap-10"
    >
      <!-- Blog Posts Main Column -->
      <div class="w-full lg:w-8/12">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl font-bold text-gray-800">Post</h2>
          <select
            id="sort-select"
            class="border-gray-300 rounded-md shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
          >
            <option value="latest">Latest</option>
            <option value="oldest">Oldest</option>
          </select>
        </div>
        <div id="all-posts" class="space-y-8"></div>
        <div class="flex mt-8">
          <button
            id="prev-page"
            class="px-3 py-2 mx-1 font-medium text-gray-500 bg-white rounded-md"
            disabled
          >
            Previous
          </button>
          <span id="page-numbers" class="flex"></span>
          <button
            id="next-page"
            class="px-3 py-2 mx-1 font-medium text-gray-700 bg-white rounded-md"
          >
            Next
          </button>
        </div>
      </div>
      <!-- Sidebar -->
      <aside class="w-full lg:w-4/12 flex flex-col gap-8">
        <div>
          <h3 class="mb-4 text-xl font-bold text-gray-700">Authors</h3>
          <div class="bg-white rounded-lg shadow px-6 py-4">
            <ul id="authors-list" class="space-y-6"></ul>
          </div>
        </div>
        <div>
          <h3 class="mb-4 text-xl font-bold text-gray-700">Categories</h3>
          <div class="bg-white rounded-lg shadow px-6 py-4">
            <ul id="categories-list" class="space-y-2"></ul>
          </div>
        </div>
        <div>
          <h3 class="mb-4 text-xl font-bold text-gray-700">Recent Post</h3>
          <div
            id="recent-post"
            class="bg-white rounded-lg shadow px-8 py-6"
          ></div>
        </div>
      </aside>
    </section>

    <!-- Modal for comments -->
    <div
      id="comments-modal"
      class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden"
    >
      <div class="bg-white rounded-lg shadow-lg max-w-lg w-full p-6 relative">
        <button
          id="close-comments-modal"
          class="absolute top-2 right-2 text-xl text-gray-500 hover:text-black"
        >
          &times;
        </button>
        <h3
          class="text-xl font-bold text-purple-700 mb-4"
          id="modal-post-title"
        >
          Comments
        </h3>
        <div id="comments-list" class="mb-4 max-h-60 overflow-y-auto"></div>
        <form id="add-comment-form" class="space-y-2">
          <textarea
            id="comment-input"
            class="w-full border border-purple-300 rounded p-2"
            rows="3"
            placeholder="Add a comment..."
            required
          ></textarea>
          <button
            type="submit"
            class="btn-primary px-4 py-2 rounded font-bold text-white bg-purple-600 hover:bg-purple-700"
          >
            Post Comment
          </button>
          <div id="comment-message" class="text-sm mt-1"></div>
        </form>
      </div>
    </div>
    <script>
      const POSTS_PER_PAGE = 5;
      let currentPage = 1;
      let totalPages = 1;
      let allPosts = [];
      let selectedPostId = null;
      let selectedPostTitle = "";

      function isLoggedIn() {
        return !!localStorage.getItem("token");
      }

      // Render blog posts in card style
      function renderPosts() {
        const postContainer = document.getElementById("all-posts");
        postContainer.innerHTML = "";
        if (allPosts.length > 0) {
          const sortValue = document.getElementById("sort-select").value;
          let posts = [...allPosts];
          if (sortValue === "latest") {
            posts.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            );
          } else {
            posts.sort(
              (a, b) => new Date(a.created_at) - new Date(b.created_at)
            );
          }
          const start = (currentPage - 1) * POSTS_PER_PAGE;
          const end = start + POSTS_PER_PAGE;
          posts.slice(start, end).forEach((post, idx) => {
            const isLong = post.content.length > 200;
            const shortContent = isLong
              ? post.content.substring(0, 200) + "..."
              : post.content;
            const div = document.createElement("div");
            div.className = "bg-white rounded-lg shadow-md px-8 py-6";
            div.innerHTML = `
              <div class="flex items-center justify-between">
                <span class="font-light text-gray-600">${new Date(
                  post.created_at
                ).toLocaleDateString(undefined, {
                  month: "short",
                  day: "numeric",
                  year: "numeric",
                })}</span>
                <a href="#" class="px-2 py-1 font-bold text-gray-100 bg-gray-600 rounded hover:bg-gray-500">${
                  post.category || "General"
                }</a>
              </div>
              <div class="mt-2">
                <a href="#" class="text-2xl font-bold text-gray-800 hover:underline">${
                  post.title
                }</a>
                <p class="mt-2 text-gray-600" id="post-content-${idx}">${shortContent}</p>
                ${
                  isLong
                    ? `<button class="text-blue-500 hover:underline read-more-btn" data-idx="${idx}" data-state="short">Read more</button>`
                    : ""
                }
              </div>
              <div class="flex items-center justify-between mt-4">
                <div class="flex items-center gap-6">
                  <!-- Like Button -->
                  <button class="flex items-center gap-1 text-gray-500 hover:text-blue-600 like-btn" data-id="${
                    post.id
                  }">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current" viewBox="0 0 20 20"><path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/></svg>
                    <span class="like-count">${post.likes || 0}</span>
                  </button>
                  <!-- Comment Button -->
                  <button class="flex items-center gap-1 text-gray-500 hover:text-purple-600 comment-btn" data-id="${
                    post.id
                  }">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current" viewBox="0 0 20 20"><path d="M18 10c0 3.866-3.582 7-8 7a8.96 8.96 0 01-4.688-1.313L2 17l1.313-3.312A7.963 7.963 0 012 10c0-3.866 3.582-7 8-7s8 3.134 8 7z"/></svg>
                    <span>${post.comments_count || 0}</span>
                  </button>
                </div>
                <div class="flex items-center">
                  <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(
                    post.username || "Unknown"
                  )}&background=random" alt="avatar" class="object-cover w-10 h-10 mx-4 rounded-full">
                  <span class="font-bold text-gray-700 hover:underline">${
                    post.username || "Unknown"
                  }</span>
                </div>
              </div>
              <div class="inline-comment-section mt-4 hidden" id="inline-comment-${
                post.id
              }">
                <div class="mb-2 font-semibold text-purple-700">Comments</div>
                <div class="comments-list mb-2"></div>
                <form class="add-comment-form space-y-2">
                  <textarea class="w-full border border-purple-300 rounded p-2 comment-input" rows="2" placeholder="Add a comment..." required></textarea>
                  <button type="submit" class="btn-primary px-4 py-2 rounded font-bold text-white bg-purple-600 hover:bg-purple-700">Post Comment</button>
                  <div class="comment-message text-sm mt-1"></div>
                </form>
              </div>
            `;
            postContainer.appendChild(div);

            // Attach event for "Read more"
            if (isLong) {
              div.querySelector(".read-more-btn").onclick = function () {
                const contentP = document.getElementById(`post-content-${idx}`);
                if (this.getAttribute("data-state") === "short") {
                  contentP.textContent = post.content;
                  this.textContent = "Show less";
                  this.setAttribute("data-state", "full");
                } else {
                  contentP.textContent = shortContent;
                  this.textContent = "Read more";
                  this.setAttribute("data-state", "short");
                }
              };
            }
            // Like button event
            div.querySelector(".like-btn").onclick = function () {
              const countSpan = this.querySelector(".like-count");
              let count = parseInt(countSpan.textContent, 10) || 0;
              count++;
              countSpan.textContent = count;
              // TODO: send like to backend if needed
            };

            // Inline comment logic
            const commentBtn = div.querySelector(".comment-btn");
            const inlineSection = div.querySelector(
              `#inline-comment-${post.id}`
            );
            commentBtn.onclick = function () {
              // Hide all other inline comment sections
              document
                .querySelectorAll(".inline-comment-section")
                .forEach((el) => el.classList.add("hidden"));
              // Show this one
              inlineSection.classList.toggle("hidden");
              if (!inlineSection.classList.contains("hidden")) {
                loadInlineComments(post.id, inlineSection);
              }
            };

            // Handle comment form submit
            const addCommentForm =
              inlineSection.querySelector(".add-comment-form");
            const commentInput = inlineSection.querySelector(".comment-input");
            const commentMessage =
              inlineSection.querySelector(".comment-message");
            addCommentForm.onsubmit = async function (e) {
              e.preventDefault();
              commentMessage.textContent = "";
              if (!isLoggedIn()) {
                commentMessage.textContent =
                  "You must be logged in to comment.";
                commentMessage.className = "text-red-600 text-center mt-2";
                return;
              }
              const content = commentInput.value.trim();
              if (!content) {
                commentMessage.textContent = "Comment cannot be empty.";
                commentMessage.className = "text-red-600 text-center mt-2";
                return;
              }
              try {
                const res = await fetch(
                  `https://blogs-api-q51w.onrender.com/blogs/${post.id}/comment`,
                  {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      Authorization: "Bearer " + localStorage.getItem("token"),
                    },
                    body: JSON.stringify({ content }),
                  }
                );
                const data = await res.json();
                if (data.success) {
                  commentInput.value = "";
                  commentMessage.textContent = "Comment added!";
                  commentMessage.className = "text-green-600 text-center mt-2";
                  loadInlineComments(post.id, inlineSection);
                } else {
                  commentMessage.textContent =
                    data.message || "Failed to add comment.";
                  commentMessage.className = "text-red-600 text-center mt-2";
                }
              } catch (err) {
                commentMessage.textContent = "Failed to add comment.";
                commentMessage.className = "text-red-600 text-center mt-2";
              }
            };
          });
        } else {
          postContainer.innerHTML =
            "<p class='text-purple-500'>No blog posts found.</p>";
        }
        updatePaginationControls();
      }

      function updatePaginationControls() {
        document.getElementById("prev-page").disabled = currentPage === 1;
        document.getElementById("next-page").disabled =
          currentPage === totalPages || totalPages === 0;

        // Render page numbers
        const pageNumbers = document.getElementById("page-numbers");
        pageNumbers.innerHTML = "";
        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement("button");
          btn.textContent = i;
          btn.className =
            "px-3 py-1 rounded border border-purple-300 mx-1 text-purple-700 font-semibold transition " +
            (i === currentPage
              ? "bg-purple-600 text-white"
              : "bg-white hover:bg-purple-100");
          btn.onclick = function () {
            currentPage = i;
            renderPosts();
          };
          pageNumbers.appendChild(btn);
        }
      }

      document.getElementById("prev-page").onclick = function () {
        if (currentPage > 1) {
          currentPage--;
          renderPosts();
        }
      };

      document.getElementById("next-page").onclick = function () {
        if (currentPage < totalPages) {
          currentPage++;
          renderPosts();
        }
      };

      document
        .getElementById("sort-select")
        .addEventListener("change", function () {
          currentPage = 1; // Reset to first page when sorting changes
          renderPosts();
        });

      fetch("https://blogs-api-q51w.onrender.com/blogs")
        .then((res) => res.json())
        .then((data) => {
          if (data.success && data.data && data.data.length > 0) {
            allPosts = data.data;
            totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);
            renderPosts();
            renderRecentPost(); // <-- Add this line
          } else {
            allPosts = [];
            totalPages = 1;
            renderPosts();
            renderRecentPost(); // <-- Add this line
          }
        })
        .catch((err) => {
          document.getElementById("all-posts").innerHTML =
            "<p class='text-red-500'>Failed to load blog posts.</p>";
          console.error("Error fetching blogs:", err);
        });

      // --- Comments Modal Logic ---
      const commentsModal = document.getElementById("comments-modal");
      const closeCommentsModalBtn = document.getElementById(
        "close-comments-modal"
      );
      const commentsList = document.getElementById("comments-list");
      const addCommentForm = document.getElementById("add-comment-form");
      const commentInput = document.getElementById("comment-input");
      const commentMessage = document.getElementById("comment-message");
      const modalPostTitle = document.getElementById("modal-post-title");

      function openCommentsModal(postId, postTitle) {
        modalPostTitle.textContent = `Comments for: ${postTitle}`;
        commentsModal.classList.remove("hidden");
        commentInput.value = "";
        commentMessage.textContent = "";
        // Show/hide comment form based on login
        if (isLoggedIn()) {
          addCommentForm.classList.remove("hidden");
        } else {
          addCommentForm.classList.add("hidden");
          commentMessage.textContent = "You must be logged in to comment.";
          commentMessage.className = "text-red-600 text-center mt-2";
        }
        loadComments(postId);
      }

      function closeCommentsModal() {
        commentsModal.classList.add("hidden");
        commentsList.innerHTML = "";
        commentMessage.textContent = "";
      }

      closeCommentsModalBtn.onclick = closeCommentsModal;
      commentsModal.onclick = function (e) {
        if (e.target === commentsModal) closeCommentsModal();
      };

      async function loadComments(postId) {
        commentsList.innerHTML =
          "<div class='text-gray-500'>Loading comments...</div>";
        try {
          const res = await fetch(
            `https://blogs-api-q51w.onrender.com/blogs/${postId}/comments`
          );
          const data = await res.json();
          if (data.success && Array.isArray(data.comments)) {
            if (data.comments.length === 0) {
              commentsList.innerHTML =
                "<div class='text-gray-500'>No comments yet.</div>";
            } else {
              commentsList.innerHTML = "";
              data.comments.forEach((comment) => {
                const div = document.createElement("div");
                div.className = "mb-3 border-b pb-2";
                div.innerHTML = `
                  <div class="font-semibold text-purple-700">${
                    comment.username || "Anonymous"
                  }</div>
                  <div class="text-gray-800">${comment.content}</div>
                  <div class="text-xs text-gray-400">${new Date(
                    comment.created_at
                  ).toLocaleString()}</div>
                `;
                commentsList.appendChild(div);
              });
            }
          } else {
            commentsList.innerHTML =
              "<div class='text-red-500'>Failed to load comments.</div>";
          }
        } catch (err) {
          commentsList.innerHTML =
            "<div class='text-red-500'>Failed to load comments.</div>";
        }
      }

      addCommentForm.onsubmit = async function (e) {
        e.preventDefault();
        commentMessage.textContent = "";
        if (!isLoggedIn()) {
          commentMessage.textContent = "You must be logged in to comment.";
          commentMessage.className = "text-red-600 text-center mt-2";
          return;
        }
        const content = commentInput.value.trim();
        if (!content) {
          commentMessage.textContent = "Comment cannot be empty.";
          commentMessage.className = "text-red-600 text-center mt-2";
          return;
        }
        try {
          const res = await fetch(
            `https://blogs-api-q51w.onrender.com/blogs/${selectedPostId}/comments`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + localStorage.getItem("token"),
              },
              body: JSON.stringify({ content }),
            }
          );
          const data = await res.json();
          if (data.success) {
            commentInput.value = "";
            commentMessage.textContent = "Comment added!";
            commentMessage.className = "text-green-600 text-center mt-2";
            loadComments(selectedPostId);
          } else {
            commentMessage.textContent =
              data.message || "Failed to add comment.";
            commentMessage.className = "text-red-600 text-center mt-2";
          }
        } catch (err) {
          commentMessage.textContent = "Failed to add comment.";
          commentMessage.className = "text-red-600 text-center mt-2";
        }
      };

      let allAuthors = [];
      let allCategories = [];

      // Fetch and render authors
      fetch("https://blogs-api-q51w.onrender.com/blogs/authors")
        .then((res) => res.json())
        .then((data) => {
          if (data.success && data.data && data.data.length > 0) {
            allAuthors = data.data;
            renderAuthors();
          }
        })
        .catch((err) => {
          const authorsList = document.getElementById("authors-list");
          authorsList.innerHTML =
            "<li class='text-red-500'>Failed to load authors.</li>";
          console.error("Error fetching authors:", err);
        });

      // Sidebar: Authors
      function renderAuthors() {
        const authorsList = document.getElementById("authors-list");
        authorsList.innerHTML = "";
        if (allAuthors && allAuthors.length > 0) {
          // Show only the top 5 authors by total_posts
          allAuthors.slice(0, 5).forEach((author) => {
            const li = document.createElement("li");
            li.className = "flex items-center";
            li.innerHTML = `
              <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(
                author.username
              )}&background=random" alt="avatar" class="object-cover w-10 h-10 mx-4 rounded-full">
              <p>
                <span class="mx-1 font-bold text-gray-700">${
                  author.username
                }</span>
                <span class="text-sm font-light text-gray-700">Created ${
                  author.total_posts || 0
                } Posts</span>
              </p>
            `;
            authorsList.appendChild(li);
          });
        } else {
          authorsList.innerHTML =
            "<li class='text-gray-500'>No authors found.</li>";
        }
      }

      // Sidebar: Categories
      function renderCategories() {
        const categoriesList = document.getElementById("categories-list");
        categoriesList.innerHTML = "";
        if (allCategories && allCategories.length > 0) {
          // Show only the first 6 categories
          allCategories.slice(0, 6).forEach((cat) => {
            const li = document.createElement("li");
            li.innerHTML = `<span class="font-bold text-gray-700">- ${cat.name}</span>`;
            categoriesList.appendChild(li);
          });
        } else {
          categoriesList.innerHTML =
            "<li class='text-gray-500'>No categories found.</li>";
        }
      }

      // Sidebar: Recent Post
      function renderRecentPost() {
        const recentPostDiv = document.getElementById("recent-post");
        if (!allPosts || allPosts.length === 0) {
          recentPostDiv.innerHTML =
            "<div class='text-gray-500'>No recent post.</div>";
          return;
        }
        // Show the latest post
        const sortedPosts = [...allPosts].sort(
          (a, b) => new Date(b.created_at) - new Date(a.created_at)
        );
        const post = sortedPosts[0];
        recentPostDiv.innerHTML = `
          <div class="flex items-center justify-end">
            <span class="px-2 py-1 text-sm text-gray-100 bg-gray-600 rounded hover:bg-gray-500">${
              post.category || "General"
            }</span>
          </div>
          <div class="mt-4">
            <div class="text-lg font-medium text-gray-700 mb-2">${
              post.title
            }</div>
            <div class="text-gray-600 text-sm mb-4">${
              post.content.length > 80
                ? post.content.substring(0, 80) + "..."
                : post.content
            }</div>
            <div class="flex items-center mt-2">
              <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(
                post.username || "Unknown"
              )}&background=random" alt="avatar" class="object-cover w-8 h-8 rounded-full">
              <span class="mx-3 text-sm text-gray-700 font-semibold">${
                post.username || "Unknown"
              }</span>
            </div>
          </div>
        `;
      }

      // Fetch and render categories from admin dashboard endpoint
      const token = localStorage.getItem("token"); // or your token key

      fetch("https://blogs-api-q51w.onrender.com/admin/dashboard", {
        headers: {
          Authorization: `Bearer ${token}`,
        },
      })
        .then((res) => res.json())
        .then((data) => {
          if (
            data.success &&
            data.data &&
            Array.isArray(data.data.all_categories) &&
            data.data.all_categories.length > 0
          ) {
            allCategories = data.data.all_categories;
            renderCategories();
          }
        })
        .catch((err) => {
          const categoriesList = document.getElementById("categories-list");
          categoriesList.innerHTML =
            "<li class='text-red-500'>Failed to load categories.</li>";
          console.error("Error fetching categories:", err);
        });

      const themeToggle = document.getElementById("theme-toggle");
      const body = document.body;

      function setTheme(isDark) {
        if (isDark) {
          body.classList.add("dark");
          body.classList.remove("bg-gray-100", "text-gray-900");
          body.classList.add("bg-gray-900", "text-gray-100");
          themeToggle.textContent = "Light Mode";
          themeToggle.classList.remove("bg-gray-200", "text-gray-800");
          themeToggle.classList.add("bg-gray-700", "text-gray-100");
        } else {
          body.classList.remove("dark");
          body.classList.remove("bg-gray-900", "text-gray-100");
          body.classList.add("bg-gray-100", "text-gray-900");
          themeToggle.textContent = "Dark Mode";
          themeToggle.classList.remove("bg-gray-700", "text-gray-100");
          themeToggle.classList.add("bg-gray-200", "text-gray-800");
        }
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }

      // Load theme on page load
      setTheme(localStorage.getItem("theme") === "dark");

      themeToggle.addEventListener("click", () => {
        const isDark = !body.classList.contains("dark");
        setTheme(isDark);
      });
    </script>

    <footer class="bg-white border-t border-gray-200 text-gray-600 py-8 mt-10">
      <div class="container mx-auto px-4 text-center space-y-4">
        <div class="flex justify-center gap-6">
          <a href="#" class="hover:text-gray-900">Instagram</a>
          <a href="#" class="hover:text-gray-900">Twitter</a>
          <a href="#" class="hover:text-gray-900">Facebook</a>
        </div>
        <p>© 2025 Blog Post</p>
      </div>
    </footer>
  </body>
</html>
