<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-purple-100 via-purple-200 to-purple-300 text-gray-900 font-sans"
  >
    <header
      class="bg-gradient-to-r from-purple-700 to-purple-500 text-white py-5 shadow-md sticky top-0 z-50"
    >
      <div class="container mx-auto px-4 flex justify-between items-center">
        <h1 class="text-3xl font-bold tracking-wide">THOUGHT NEST</h1>
        <nav>
          <ul class="flex gap-6 text-lg font-medium">
            <li><a href="index.html" class="hover:underline">HOME</a></li>
            <li><a href="blog.html" class="hover:underline">BLOG</a></li>
            <!-- <li><a href="about.html" class="hover:underline">About</a></li>
            <li><a href="contact.html" class="hover:underline">Contact</a></li> -->
          </ul>
        </nav>
      </div>
    </header>
    <section
      class="blog-section max-w-4xl mx-auto mt-12 bg-white/90 p-8 rounded-xl shadow"
    >
      <h2 class="text-3xl font-bold text-purple-800 mb-6">All Blog Posts</h2>
      <div class="post-list grid gap-8" id="all-posts"></div>
      <div
        class="flex justify-center items-center gap-2 mt-8"
        id="pagination-controls"
      >
        <button id="prev-page" class="btn-primary px-4 py-2" disabled>
          Prev
        </button>
        <span id="page-numbers" class="flex gap-1"></span>
        <button id="next-page" class="btn-primary px-4 py-2" disabled>
          Next
        </button>
      </div>
    </section>

    <script>
      const POSTS_PER_PAGE = 5;
      let currentPage = 1;
      let totalPages = 1;
      let allPosts = [];

      function renderPosts() {
        const postContainer = document.getElementById("all-posts");
        postContainer.innerHTML = "";
        if (allPosts.length > 0) {
          const start = (currentPage - 1) * POSTS_PER_PAGE;
          const end = start + POSTS_PER_PAGE;
          allPosts.slice(start, end).forEach((post) => {
            const div = document.createElement("div");
            div.className =
              "bg-white p-6 rounded-lg shadow border border-purple-200";
            const isLong = post.content.length > 300;
            let previewHtml;
            if (isLong) {
              const previewText = post.content.substring(0, 300);
              previewHtml = `${previewText}<button class="see-more-btn text-purple-400 underline ml-2" data-id="${post.id}" data-state="less">See more</button>`;
            } else {
              previewHtml = post.content;
            }
            div.innerHTML = `
              <h3 class="text-xl font-semibold mb-2 text-purple-800">${
                post.title
              }</h3>
              <div class="prose prose-p:mb-2 prose-p:whitespace-pre-line text-justify text-black mb-2" style="white-space:pre-line;">
                <span class="blog-preview">${previewHtml}</span>
              </div>
              <span class="text-xs text-purple-500">By ${
                post.username || "Unknown"
              } | ${new Date(post.created_at).toLocaleString()}</span>
            `;
            postContainer.appendChild(div);
          });

          // Attach see more/see less listeners
          document.querySelectorAll(".see-more-btn").forEach((btn) => {
            btn.addEventListener("click", function handler() {
              const post = allPosts.find(
                (p) => p.id == btn.getAttribute("data-id")
              );
              const previewSpan = btn.parentElement;
              if (btn.getAttribute("data-state") === "less") {
                previewSpan.innerHTML = `${post.content}<button class="see-more-btn text-purple-400 underline ml-2" data-id="${post.id}" data-state="more">See less</button>`;
              } else {
                const previewText = post.content.substring(0, 300);
                previewSpan.innerHTML = `${previewText}<button class="see-more-btn text-purple-400 underline ml-2" data-id="${post.id}" data-state="less">See more</button>`;
              }
              // Re-attach listener to the new button
              previewSpan
                .querySelector(".see-more-btn")
                .addEventListener("click", handler);
            });
          });
        } else {
          postContainer.innerHTML =
            "<p class='text-purple-500'>No blog posts found.</p>";
        }
        updatePaginationControls();
      }

      function updatePaginationControls() {
        document.getElementById("prev-page").disabled = currentPage === 1;
        document.getElementById("next-page").disabled =
          currentPage === totalPages || totalPages === 0;

        // Render page numbers
        const pageNumbers = document.getElementById("page-numbers");
        pageNumbers.innerHTML = "";
        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement("button");
          btn.textContent = i;
          btn.className =
            "px-3 py-1 rounded border border-purple-300 mx-1 text-purple-700 font-semibold transition " +
            (i === currentPage
              ? "bg-purple-600 text-white"
              : "bg-white hover:bg-purple-100");
          btn.onclick = function () {
            currentPage = i;
            renderPosts();
          };
          pageNumbers.appendChild(btn);
        }
      }

      document.getElementById("prev-page").onclick = function () {
        if (currentPage > 1) {
          currentPage--;
          renderPosts();
        }
      };

      document.getElementById("next-page").onclick = function () {
        if (currentPage < totalPages) {
          currentPage++;
          renderPosts();
        }
      };

      fetch("http://localhost:3600/blogs")
        .then((res) => res.json())
        .then((data) => {
          if (data.success && data.data && data.data.length > 0) {
            allPosts = data.data;
            totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);
            renderPosts();
          } else {
            allPosts = [];
            totalPages = 1;
            renderPosts();
          }
        })
        .catch((err) => {
          document.getElementById("all-posts").innerHTML =
            "<p class='text-red-500'>Failed to load blog posts.</p>";
          console.error("Error fetching blogs:", err);
        });
    </script>

    <footer
      class="bg-gradient-to-r from-purple-700 to-purple-900 text-white py-8 mt-10"
    >
      <div class="container mx-auto px-4 text-center space-y-4">
        <div class="flex justify-center gap-6">
          <a href="#" class="hover:text-purple-200">Instagram</a>
          <a href="#" class="hover:text-purple-200">Twitter</a>
          <a href="#" class="hover:text-purple-200">Facebook</a>
        </div>
        <p>© 2025 Blog Post</p>
      </div>
    </footer>
  </body>
</html>
