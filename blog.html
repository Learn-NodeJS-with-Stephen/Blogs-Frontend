<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-purple-100 via-purple-200 to-purple-300 text-gray-900 font-sans"
  >
    <header
      class="bg-gradient-to-r from-purple-700 to-purple-500 text-white py-5 shadow-md sticky top-0 z-50"
    >
      <div class="container mx-auto px-4 flex justify-between items-center">
        <h1 class="text-3xl font-bold tracking-wide">THOUGHT NEST</h1>
        <nav>
          <ul class="flex gap-6 text-lg font-medium">
            <li><a href="index.html" class="hover:underline">HOME</a></li>
            <li><a href="blog.html" class="hover:underline">BLOG</a></li>
            <!-- <li>
              <a href="admin-dashboard.html" class="hover:underline font-bold"
                >ADMIN</a
              >
            </li> -->
            <li>
              <a href="admin-login.html" class="hover:underline font-bold"
                >ADMIN</a
              >
            </li>
            <!-- <li><a href="about.html" class="hover:underline">About</a></li>
            <li><a href="contact.html" class="hover:underline">Contact</a></li> -->
          </ul>
        </nav>
      </div>
    </header>
    <section
      class="blog-section max-w-4xl mx-auto mt-12 bg-white/90 p-8 rounded-xl shadow"
    >
      <h2 class="text-3xl font-bold text-purple-800 mb-6">All Blog Posts</h2>
      <div class="post-list grid gap-8" id="all-posts"></div>
      <div
        class="flex justify-center items-center gap-2 mt-8"
        id="pagination-controls"
      >
        <button id="prev-page" class="btn-primary px-4 py-2" disabled>
          Prev
        </button>
        <span id="page-numbers" class="flex gap-1"></span>
        <button id="next-page" class="btn-primary px-4 py-2" disabled>
          Next
        </button>
      </div>
    </section>

    <!-- Modal for comments -->
    <div
      id="comments-modal"
      class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden"
    >
      <div class="bg-white rounded-lg shadow-lg max-w-lg w-full p-6 relative">
        <button
          id="close-comments-modal"
          class="absolute top-2 right-2 text-xl text-gray-500 hover:text-black"
        >
          &times;
        </button>
        <h3
          class="text-xl font-bold text-purple-700 mb-4"
          id="modal-post-title"
        >
          Comments
        </h3>
        <div id="comments-list" class="mb-4 max-h-60 overflow-y-auto"></div>
        <form id="add-comment-form" class="space-y-2">
          <textarea
            id="comment-input"
            class="w-full border border-purple-300 rounded p-2"
            rows="3"
            placeholder="Add a comment..."
            required
          ></textarea>
          <button
            type="submit"
            class="btn-primary px-4 py-2 rounded font-bold text-white bg-purple-600 hover:bg-purple-700"
          >
            Post Comment
          </button>
          <div id="comment-message" class="text-sm mt-1"></div>
        </form>
      </div>
    </div>
    <script>
      const POSTS_PER_PAGE = 5;
      let currentPage = 1;
      let totalPages = 1;
      let allPosts = [];
      let selectedPostId = null;
      let selectedPostTitle = "";

      function isLoggedIn() {
        return !!localStorage.getItem("token");
      }

      function renderPosts() {
        const postContainer = document.getElementById("all-posts");
        postContainer.innerHTML = "";
        if (allPosts.length > 0) {
          const start = (currentPage - 1) * POSTS_PER_PAGE;
          const end = start + POSTS_PER_PAGE;
          allPosts.slice(start, end).forEach((post) => {
            const div = document.createElement("div");
            div.className =
              "bg-white p-6 rounded-lg shadow border border-purple-200";
            const isLong = post.content.length > 300;
            let previewHtml;
            if (isLong) {
              const previewText = post.content.substring(0, 300);
              previewHtml = `${previewText}<button class="see-more-btn text-purple-400 underline ml-2" data-id="${post.id}" data-state="less">See more</button>`;
            } else {
              previewHtml = post.content;
            }
            div.innerHTML = `
              <h3 class="text-xl font-semibold mb-2 text-purple-800">${
                post.title
              }</h3>
              <div class="prose prose-p:mb-2 prose-p:whitespace-pre-line text-justify text-black mb-2" style="white-space:pre-line;">
                <span class="blog-preview">${previewHtml}</span>
              </div>
              <span class="text-xs text-purple-500">By ${
                post.username || "Unknown"
              } | ${new Date(post.created_at).toLocaleString()}</span>
              <button class="show-comments-btn mt-4 block text-purple-700 underline font-semibold" data-id="${
                post.id
              }" data-title="${encodeURIComponent(
              post.title
            )}">Show Comments</button>
            `;
            postContainer.appendChild(div);
          });

          // Attach see more/see less listeners
          document.querySelectorAll(".see-more-btn").forEach((btn) => {
            btn.addEventListener("click", function handler() {
              const post = allPosts.find(
                (p) => p.id == btn.getAttribute("data-id")
              );
              const previewSpan = btn.parentElement;
              if (btn.getAttribute("data-state") === "less") {
                previewSpan.innerHTML = `${post.content}<button class="see-more-btn text-purple-400 underline ml-2" data-id="${post.id}" data-state="more">See less</button>`;
              } else {
                const previewText = post.content.substring(0, 300);
                previewSpan.innerHTML = `${previewText}<button class="see-more-btn text-purple-400 underline ml-2" data-id="${post.id}" data-state="less">See more</button>`;
              }
              // Re-attach listener to the new button
              previewSpan
                .querySelector(".see-more-btn")
                .addEventListener("click", handler);
            });
          });

          // Attach show comments listeners
          document.querySelectorAll(".show-comments-btn").forEach((btn) => {
            btn.addEventListener("click", function () {
              selectedPostId = btn.getAttribute("data-id");
              selectedPostTitle = decodeURIComponent(
                btn.getAttribute("data-title")
              );
              openCommentsModal(selectedPostId, selectedPostTitle);
            });
          });
        } else {
          postContainer.innerHTML =
            "<p class='text-purple-500'>No blog posts found.</p>";
        }
        updatePaginationControls();
      }

      function updatePaginationControls() {
        document.getElementById("prev-page").disabled = currentPage === 1;
        document.getElementById("next-page").disabled =
          currentPage === totalPages || totalPages === 0;

        // Render page numbers
        const pageNumbers = document.getElementById("page-numbers");
        pageNumbers.innerHTML = "";
        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement("button");
          btn.textContent = i;
          btn.className =
            "px-3 py-1 rounded border border-purple-300 mx-1 text-purple-700 font-semibold transition " +
            (i === currentPage
              ? "bg-purple-600 text-white"
              : "bg-white hover:bg-purple-100");
          btn.onclick = function () {
            currentPage = i;
            renderPosts();
          };
          pageNumbers.appendChild(btn);
        }
      }

      document.getElementById("prev-page").onclick = function () {
        if (currentPage > 1) {
          currentPage--;
          renderPosts();
        }
      };

      document.getElementById("next-page").onclick = function () {
        if (currentPage < totalPages) {
          currentPage++;
          renderPosts();
        }
      };

      fetch("http://localhost:3600/blogs")
        .then((res) => res.json())
        .then((data) => {
          if (data.success && data.data && data.data.length > 0) {
            allPosts = data.data;
            totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);
            renderPosts();
          } else {
            allPosts = [];
            totalPages = 1;
            renderPosts();
          }
        })
        .catch((err) => {
          document.getElementById("all-posts").innerHTML =
            "<p class='text-red-500'>Failed to load blog posts.</p>";
          console.error("Error fetching blogs:", err);
        });

      // --- Comments Modal Logic ---
      const commentsModal = document.getElementById("comments-modal");
      const closeCommentsModalBtn = document.getElementById(
        "close-comments-modal"
      );
      const commentsList = document.getElementById("comments-list");
      const addCommentForm = document.getElementById("add-comment-form");
      const commentInput = document.getElementById("comment-input");
      const commentMessage = document.getElementById("comment-message");
      const modalPostTitle = document.getElementById("modal-post-title");

      function openCommentsModal(postId, postTitle) {
        modalPostTitle.textContent = `Comments for: ${postTitle}`;
        commentsModal.classList.remove("hidden");
        commentInput.value = "";
        commentMessage.textContent = "";
        // Show/hide comment form based on login
        if (isLoggedIn()) {
          addCommentForm.classList.remove("hidden");
        } else {
          addCommentForm.classList.add("hidden");
          commentMessage.textContent = "You must be logged in to comment.";
          commentMessage.className = "text-red-600 text-center mt-2";
        }
        loadComments(postId);
      }

      function closeCommentsModal() {
        commentsModal.classList.add("hidden");
        commentsList.innerHTML = "";
        commentMessage.textContent = "";
      }

      closeCommentsModalBtn.onclick = closeCommentsModal;
      commentsModal.onclick = function (e) {
        if (e.target === commentsModal) closeCommentsModal();
      };

      async function loadComments(postId) {
        commentsList.innerHTML =
          "<div class='text-gray-500'>Loading comments...</div>";
        try {
          const res = await fetch(
            `http://localhost:3600/blogs/${postId}/comments`
          );
          const data = await res.json();
          if (data.success && Array.isArray(data.comments)) {
            if (data.comments.length === 0) {
              commentsList.innerHTML =
                "<div class='text-gray-500'>No comments yet.</div>";
            } else {
              commentsList.innerHTML = "";
              data.comments.forEach((comment) => {
                const div = document.createElement("div");
                div.className = "mb-3 border-b pb-2";
                div.innerHTML = `
                  <div class="font-semibold text-purple-700">${
                    comment.username || "Anonymous"
                  }</div>
                  <div class="text-gray-800">${comment.content}</div>
                  <div class="text-xs text-gray-400">${new Date(
                    comment.created_at
                  ).toLocaleString()}</div>
                `;
                commentsList.appendChild(div);
              });
            }
          } else {
            commentsList.innerHTML =
              "<div class='text-red-500'>Failed to load comments.</div>";
          }
        } catch (err) {
          commentsList.innerHTML =
            "<div class='text-red-500'>Failed to load comments.</div>";
        }
      }

      addCommentForm.onsubmit = async function (e) {
        e.preventDefault();
        commentMessage.textContent = "";
        if (!isLoggedIn()) {
          commentMessage.textContent = "You must be logged in to comment.";
          commentMessage.className = "text-red-600 text-center mt-2";
          return;
        }
        const content = commentInput.value.trim();
        if (!content) {
          commentMessage.textContent = "Comment cannot be empty.";
          commentMessage.className = "text-red-600 text-center mt-2";
          return;
        }
        try {
          const res = await fetch(
            `http://localhost:3600/blogs/${selectedPostId}/comments`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + localStorage.getItem("token"),
              },
              body: JSON.stringify({ content }),
            }
          );
          const data = await res.json();
          if (data.success) {
            commentInput.value = "";
            commentMessage.textContent = "Comment added!";
            commentMessage.className = "text-green-600 text-center mt-2";
            loadComments(selectedPostId);
          } else {
            commentMessage.textContent =
              data.message || "Failed to add comment.";
            commentMessage.className = "text-red-600 text-center mt-2";
          }
        } catch (err) {
          commentMessage.textContent = "Failed to add comment.";
          commentMessage.className = "text-red-600 text-center mt-2";
        }
      };
    </script>

    <footer
      class="bg-gradient-to-r from-purple-700 to-purple-900 text-white py-8 mt-10"
    >
      <div class="container mx-auto px-4 text-center space-y-4">
        <div class="flex justify-center gap-6">
          <a href="#" class="hover:text-purple-200">Instagram</a>
          <a href="#" class="hover:text-purple-200">Twitter</a>
          <a href="#" class="hover:text-purple-200">Facebook</a>
        </div>
        <p>© 2025 Blog Post</p>
      </div>
    </footer>
  </body>
</html>
